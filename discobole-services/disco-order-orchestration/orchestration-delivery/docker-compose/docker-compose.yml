version: '3.8'

volumes:
  zookeeper_data:
  zookeeper_txns:
  kafka_data:
  mongo1_data:
  mongo1_config:

services:
  zookeeper:
    image: debezium/zookeeper:2.6.1.Final
    container_name: zookeeper
    ports:
      - 2181:2181
      - 2888:2888
      - 3888:3888
    volumes:
      - zookeeper_data:/zookeeper/data
      - zookeeper_txns:/zookeeper/txns
    restart: always
    healthcheck:
      test: [ "CMD", "echo", "Bootstrapping..." ]
      start_period: 30s

  kafka:
    image: debezium/kafka:2.6.1.Final
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - 9092:9092
    environment:
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: -Xmx192m
      KAFKA_MESSAGE_MAX_BYTES: 2202962
    volumes:
      - kafka_data:/kafka/data
    restart: always

  connect:
    image: debezium/connect:2.6.1.Final
    container_name: connect
    ports:
      - 8083:8083
    links:
      - kafka
      - mongodb
    depends_on:
      - kafka
      - mongodb
    environment:
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      BOOTSTRAP_SERVERS: kafka:29092


  connect2:
    image: debezium/connect:2.6.1.Final
    container_name: connect2
    ports:
      - 8073:8083
    links:
      - kafka
      - mongodb
    depends_on:
      - kafka
      - mongodb
    environment:
      GROUP_ID: "2"
      CONFIG_STORAGE_TOPIC: my1_connect_configs
      OFFSET_STORAGE_TOPIC: my1_connect_offsets
      STATUS_STORAGE_TOPIC: my1_connect_statuses
      BOOTSTRAP_SERVERS: kafka:29092

  kafka-ui:
    image: provectuslabs/kafka-ui:master
    container_name: kafka-ui
    ports:
      - "85:8080"
    depends_on:
      - zookeeper
      - kafka
    environment:
      - KAFKA_CLUSTERS_0_NAME=dev
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
    restart: always

  mongodb:
    image: debezium/example-mongodb:2.6.1.Final
    command: [ "--replSet", "rs0", "--bind_ip_all", "--port", "27017" ]
    hostname: mongodb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - 27017:27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "mongo1_data:/data/db"
      - "mongo1_config:/data/configdb"