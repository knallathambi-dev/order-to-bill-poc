asyncapi: 2.6.0
info:
  title: Fallout Kafka API
  version: 1.0.0
  description: >
    Fallout async api allows you
    to publish or consume events considered Fallout Incidents

servers:
  develop:
    url: http://localhost:9092
    description: Localhost development server
    protocol: kafka
  integration:
    url: kafka-integration-disco.apps.fr01.paas.tech.orange
    description: Integration server
    protocol: kafka

defaultContentType: application/json

channels:
  disco.order-management.falloutIncidentStateChange-event:
    publish:
      description: >
        publishing Fallout Incident State change
      x-scs-function-name: falloutIncidentStatePublishEvent
      operationId: FalloutIncidentStateEventProducer
      traits:
        - $ref: "#/components/operationTraits/output-group-1"
      message:
        $ref: '#/components/messages/FalloutIncidentStateChangeEvent'

components:
  operationTraits:
    input-group-1:
      bindings:
        kafka:
          groupId: input-group-1
    input-group-2:
      bindings:
        kafka:
          groupId: input-group-2
    output-group-1:
      bindings:
        kafka:
          groupId: output-group-1

  messages:
    FalloutIncidentStateChangeEvent:
      name: falloutIncidentStateChangeEvent
      title: change event about the fallout incident state.
      summary: This event is about the fallout incident state change. This event is
        often published following a successful update of the fallout incident
        state.
      payload:
        $ref: "./schemas/fallout/FalloutIncidentStateChangeEvent.yaml"
        schemaFormat: 'application/vnd.aai.asyncapi+yaml;version=2.6.0'

