$id: "https://event.com/ShippingOrderStateChangeEvent.yaml"
$schema: "http://json-schema.org/draft-07/schema#"
title: "ShippingOrderStateChangeEvent"
description: "A Shipping Order State Change Event communicates updates about the state of a shipping order."
type: "object"
allOf:
  - $ref: "../Base_event.yaml"
extends:
  $ref: "../Base_event.yaml"

properties:
  event:
    $ref: "#/definitions/ShippingOrderStateChangeEventPayload"
required:
  - "event"

definitions:
  ShippingOrderStateChangeEventPayload:
    type: "object"
    description: "The event data structure"
    properties:
      shippingOrder:
        description: "The involved resource data for the event"
        $ref: "./ShippingOrder.yaml"
    required:
      - "shippingOrder"
    title: "ShippingOrderStateChangeEventPayload"