spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 0
      properties:
        spring.kafka.topic.auto-create: true
    consumer:
      groupId: cpib-consumer-group
      clientId: cpib
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring:
          deserializer:
            value:
              delegate:
                class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: '*'
        spring.kafka.consumer.auto-offset-reset: earliest
        spring.kafka.topic.auto-create: true
        spring.kafka.consumer.max-poll-interval-ms: 0
  mvc:
    throw-exception-if-no-handler-found: 'true'
    pathmatch:
      matching-strategy: ant_path_matcher
  jackson:
    default-leniency: false
  web:
    application:
      name: cpib
      version: @project.version@
    resources:
      add-mappings: false
  data:
    mongodb:
      auto-index-creation: true
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web.exposure.include: health, metrics, prometheus
  metrics:
    tags:
      application: cpib
    distribution:
      percentiles-histogram:
        http.server.requests: true
  server:
    port: 9000

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    min-response-size: 1024
  tomcat:
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: true
  forward-headers-strategy: framework

logging:
  level:
    root: info
    com:
      orange:
        disco:
          productinventory:
            service: DEBUG
config:
  path:
    productCatalogUrl: https://catalog-product-catalog-integration-disco.apps.fr01.paas.tech.orange
    resourceInventoryManagementUrl: https://mock-server-integration-disco.apps.fr01.paas.tech.orange/api/resourceInventoryManagement/v1/resource
  enable:
    productCatalog: "true"
    resourceInventoryManagement: "true"
  security:
    userRoleRetrievalUrl: https://userRolePermission/v1/userRole
    enableTmf627Validation: "true"
    rolesAuthClientId: gateway
    discoAdminRole: disco-admin
    defaultRoles:
      CreateProduct: x500
      ReadProduct: x501
      UpdateProduct: x502
      DeleteProduct: x503
      ExportProduct: x504
      PurgeProduct: x505
      PurgeTask: x506
  cache:
    caffeine:
      spec:
        maximumSize: 1000
        expireAfterWrite: 15m
  aws:
    s3:
      bucketHost: ${BUCKET_HOST}
      bucketName: ${BUCKET_NAME}
      bucketPort: ${BUCKET_PORT}
      bucketRegion: ${BUCKET_REGION}
      accessKeyId: ${ACCESS_KEY_ID}
      secretAccessKey: ${SECRET_ACCESS_KEY}
      linkExpirationMinutes: ${LINK_EXPIRATION_MINUTES}
  tempPath: temp
  purgeBatchSize: 100
  pagination:
    limit: 1000
  export:
    limit: 1073741824  #1 GB in bytes
  webclient:
    useServiceAccount: false
    connectTimeout: 30s
    responseTimeout: 30s
    retry:
      max-attempts: 3
      max-retry-delay: 1000
  reporting:
    offer:
      kafka:
        consumer:
          groupId: offer-reporting-consumer-group
    status:
      kafka:
        consumer:
          groupId: status-reporting-consumer-group
  importing:
    externalIdentifier:
      type: "ExternalIdentifier"
      owner: "DISCO"
springdoc:
  packagesToScan:
    - com.orange.discobole.productinventory.controller
  swagger-ui:
    use-root-path: true
    configUrl: '/api-docs/swagger-config.json'
  api-docs:
    path: '/doc'

mongock:
  migration-scan-package:
    - com.orange.discobole.productinventory.migration
  transaction-enabled: false

scheduling:
  reporting:
    cronExpression: "0 0 0 * * *"
    lockName: "reportingJobLock"
    lockAtMostFor: "PT1M"
    lockAtLeastFor: "PT5S"
  jobScheduler:
    cronExpression: "0 * * * * *"
    lockName: "jobScheduler"
    lockAtMostFor: "PT1M"
    lockAtLeastFor: "PT30S"
terminateProductParameters:
  runs: '100'
  count: '100'