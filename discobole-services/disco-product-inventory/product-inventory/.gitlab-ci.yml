# ==================================================
# Include pipeline templates
# ==================================================

include:
  - project: 'discobole/discobole-to-be-continuous/service'
    ref: 'main'
    file: '/templates/gitlab-ci-service.yml'

# ==================================================
# Pipeline variables
# ==================================================

variables:
  MAVEN_BUILD_ARGS: -DskipTests package

# ==================================================
# Pipeline stages
# ==================================================

stages:
  - build
  - check
  - test
  - package-build
  - package-test
  - infra
  - deploy
  - acceptance
  - publish
  - infra-prod
  - production