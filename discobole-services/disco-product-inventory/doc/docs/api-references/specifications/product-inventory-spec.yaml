    PriceAlteration:
      description: "Is an amount, usually of money, that modifies the price charged\
        \ for an order item."
      required:
        - "price"
      type: "object"
      properties:
        applicationOffset:
          description: "applicationOffset specify when the discount or price change should start relative to a certain point"
          type: "integer"
          format: "int32"
        applicationDuration:
          $ref: "#/components/schemas/Quantity"
        description:
          description: "A narrative that explains in detail the semantics of this\
            \ order item price alteration"
          type: "string"
        name:
          description: "Name of the order item price alteration"
          type: "string"
        priceType:
          description: "A category that describes the price such as recurring, one\
            \ time and usage."
          type: "string"
