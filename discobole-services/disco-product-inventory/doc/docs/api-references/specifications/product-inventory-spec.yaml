          type: string
          default: null
        productOfferingPrice:
          $ref: "#/components/schemas/ProductOfferingPriceRef"
        price:
          $ref: "#/components/schemas/Price"
    Product:
      description: "A product offering procured by a customer or other interested\
          \ party playing a party role. A product is realized as one or more service(s)\
          \ and / or resource(s)."
      discriminator:
        propertyName: "@type"
      required:
        - "productOrderItem"
        - "status"
      type: "object"
      properties:
        id:
          description: "Unique identifier of the product"
          type: "string"
        href:
          description: "Reference of the product"
          type: "string"
        description:
          description: "Is the description of the product. It could be copied from\
              \ the description of the Product Offering."
          type: "string"
        isBundle:
          description: "If true, the product is a ProductBundle which is an instantiation\
              \ of a BundledProductOffering. If false, the product is a ProductComponent\
              \ which is an instantiation of a SimpleProductOffering."
          type: "boolean"
        isCustomerVisible:
          description: "If true, the product is visible by the customer."
          type: "boolean"
        name:
          description: "Name of the product. It could be the same as the name of the\
              \ product offering"
          type: "string"
        orderDate:
          description: "Is the date when the product was ordered"
          type: "string"
          format: "date-time"
        productSerialNumber:
          description: "Is the serial number for the product. This is typically applicable\
              \ to tangible products e.g. Broadband Router."
          type: "string"
        startDate:
          description: "Is the date from which the product starts"
          type: "string"
          format: "date-time"
        billingAccount:
          $ref: "#/components/schemas/BillingAccountRef"
        agreement:
          type: "array"
          items:
            $ref: "#/components/schemas/AgreementItemRef"
        terminationDate:
          description: "Is the date when the product was terminated"
          type: "string"
          format: "date-time"
        place:
          type: "array"
          items:
            $ref: "#/components/schemas/RelatedPlaceRefOrValue"
        productCharacteristic:
          type: "array"
          items:
            $ref: "#/components/schemas/Characteristic"
        productOffering:
          $ref: "#/components/schemas/ProductOfferingRef"
        productOrderItem:
          type: "array"
          items:
            $ref: "#/components/schemas/RelatedProductOrderItem"
          minItems: 1
        productPrice:
          type: "array"
          items:
            $ref: "#/components/schemas/ProductPrice"
        productRelationship:
          type: "array"
          items:
            $ref: "#/components/schemas/ProductRelationship"
        productSpecification:
          $ref: "#/components/schemas/ProductSpecificationRef"
        productTerm:
          type: "array"
          items:
            $ref: "#/components/schemas/ProductTerm"
        realizingResource:
          type: "array"
          items:
            $ref: "#/components/schemas/ResourceRef"
        realizingService:
          type: "array"
          items:
            $ref: "#/components/schemas/ServiceRef"
        relatedParty:
          type: "array"
          items:
            $ref: "#/components/schemas/RelatedPartyOrPartyRole"
        status:
          $ref: "#/components/schemas/ProductStatusType"
        operationalStatus:
          $ref: "#/components/schemas/ProductOperationalStatusType"
        creationDate:
          type: "string"
          description: "date when the product was created"
          format: "date-time"
        lastUpdateDate:
          type: "string"
          description: "date when the product was last updated"
          format: "date-time"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
          default: "Product"
        statusChange:
          type: "array"
          items:
            $ref: "#/components/schemas/StatusChange"
        operationalStatusChange:
          type: "array"
          items:
            $ref: "#/components/schemas/OperationalStatusChange"
        externalIdentifier:
