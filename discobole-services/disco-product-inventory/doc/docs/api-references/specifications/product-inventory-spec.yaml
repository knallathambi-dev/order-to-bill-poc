      tags:
        - "Product"
      operationId: "listProduct"
      summary: "List or find Product objects"
      description: "This operation list or find Product entities.\nAttribute selection\
        \ is enabled for all first level attributes.\nFiltering is enabled until third\
        \ level attributes"
      parameters:
        - name: "relatedParty.partyOrPartyRole.id"
          description: "id of related party"
          required: false
          in: "query"
          schema:
            type: "array"
            items:
              type: "string"
              description: "id of one of the related parties"
        - name: "productCharacteristic.value"
          description: "value of product Characteristic"
          required: false
          in: "query"
          schema:
            type: "string"
        - name: "productCharacteristic.name"
          description: "name of product Characteristic"
          required: false
          in: "query"
          schema:
            type: "string"
        - name: "productCharacteristic.@type"
          description: "Type of product Characteristic"
          required: false
          in: "query"
          schema:
            type: "string"
        - name: "productOrderItem.productOrderId"
          description: "productOrderId of one of the productOrderItem in the list"
          required: false
          in: "query"
          schema:
            type: "array"
            items:
              type: "string"
              description: "productOrderId of one of the productOrderItem in the list"
        - name: "id"
          description: "Identifier of the product"
          required: false
          in: "query"
          schema:
            type: "array"
            items:
              type: "string"
              description: "Identifier of the product"
        - name: "productOrderItem.orderItemId"
          description: "orderItemId of one of the productOrderItem in the list"
          required: false
          in: "query"
          schema:
            type: "array"
            items:
              type: "string"
              description: "orderItemId of one of the productOrderItem in the list"
        - name: "status"
          required: false
          description: "status of product has to be one of ProductStatusType"
          in: "query"
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/ProductStatusType"
        - name: "operationalStatus"
          required: false
          description: "operationalStatus of product has to be one of ProductOperationalStatusType"
          in: "query"
          schema:
            type: "array"
            items:
              $ref: "#/components/schemas/ProductOperationalStatusType"
        - name: "startDate"
          description: "startDate of product and has to follow a date time format"
          required: false
          in: "query"
          schema:
            type: "array"
            items:
              type: "string"
              description: "startDate of product and has to follow a date time format"
              format: "date-time"
        - name: "startDate.gte"
          description: "startDate.gte greater than or equal value provided which could be date or date time"
          required: false
          in: "query"
          schema:
            type: "string"
            description: "startDate.gte of product and has to follow a date time format"
