    patch:
      tags:
        - "Product"
      operationId: "patchProduct"
      summary: "Updates partially a Product"
      description: |-
        This operation does a json merge patch of a product

        **Required Properties:**

        `id`: The product id which will be patched. It should be provided as a path variable in the url.

        The body will be an object consists of:
        - `@type`: The type of the product which will be patched (e.g., Product, PhysicalProduct). It should be provided in the request body.
        - The fields which should be updated.
          - If there is a field which is a list, provide the full list after modification.
          - If there is a field which is an object, provide the full object after modification.

        Use the GET api to get the product type to provide it's value to the `@type` property in the request body of the PATCH api.

        Or use one of the following types as a request body:

          - `Product`
          - `PhysicalProduct`
          - `ShipmentProduct`
          - `Offer`
          - `SimCard`
          - `MobileLine`
          - `Service`

        **Non Patchable Fields**
        - `id`
        - `creationDate`
        - `@type`
        - `startDate`
        - `statusChange`
        - `operationalStatusChange`
      parameters:
        - name: "id"
          required: true
          in: "path"
          description: "identifier of product"
          schema:
            type: "string"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: "a product with values in attributes that needs to be patched"
          application/merge-patch+json:
            schema:
              type: object
              description: "a product with values in attributes that needs to be patched"
        description: "The Product to be updated"
      responses:
        "200":
          description: "Ok"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: "Bad Request\n\n"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not Found\n\n"
          content:
            application/json:
