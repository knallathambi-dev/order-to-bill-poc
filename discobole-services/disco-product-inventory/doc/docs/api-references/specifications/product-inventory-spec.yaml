    patch:
      tags:
        - "Product"
      operationId: "patchProducts"
      summary: "Updates partially Products"
      description: |-
        This operation allows a caller to send a list of patch operation to be applied to a list of products

        **Required Properties:**

        The body will be an array of objects, each object consists of:
        - `op`: the operation to be applied on a property
        - `path`: the path of the property to be updated in JSON Pointer format
        - `value`: it is required for all operations except `remove` operation

        **Non Patchable Fields**
        - `id`
        - `creationDate`
        - `@type`
        - `startDate`
        - `statusChange`
        - `operationalStatusChange`

        Example:
          ```js
          [
            { // this is to change `operationalStatus` to `Confirmed`
              "op": "replace",
              "path": "/productInventoryManagement/v1/product/{productId}/operationalStatus",
              "value": "Confirmed"
            },
            { // this is to remove `isBundle` property
              "op": "remove",
              "path": "/productInventoryManagement/v1/product/{productId}/isBundle"
            }
          ]
          ```

        **References:**
        - JSON Patch: https://datatracker.ietf.org/doc/html/rfc6902
        - JSON Pointer: https://datatracker.ietf.org/doc/html/rfc6901
      requestBody:
        required: true
        content:
          application/json-patch+json:
            schema:
              type: "array"
              items:
                $ref: "#/components/schemas/ProductPatch"
        description: "The patch products to be updated"
      responses:
        "200":
          description: "Ok"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  $ref: "#/components/schemas/Product"
        "400":
          description: "Bad Request\n\n"
          content:
