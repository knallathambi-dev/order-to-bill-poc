          $ref: "#/components/schemas/TimePeriod"
        applicationDuration :
          $ref: "#/components/schemas/Quantity"
        '@type':
          description: The type of the ProductPrice.
          type: string
          default: null
        '@baseType':
          description: The base type of the ProductPrice.
          type: string
          default: null
    InstallmentCharge:
      description:  "Product price paid through installments. Can be managed internally by Orange or externally by a partner."
      allOf:
        - $ref: "#/components/schemas/ProductPrice"
        - type: object
          properties:
            interestRate:
              description: Interest rate applied to the installment plan
              type: number
              format: float
            downPayment:
              description: Initial amount paid upfront
              type: number
              format: float
            partner:
              description: Partner managing the installment
              type: string
            externalId:
              description: Identifier provided by external partner when applicable
              type: string
    ProductRef:
      description: "reference to a product"
      discriminator:
        propertyName: "@type"
      required:
        - "id"
        - "@type"
      type: "object"
      properties:
        id:
          type: "string"
          description: "Unique identifier of product"
        name:
          type: "string"
          description: "The name of the product"
        href:
          type: "string"
          description: "Reference of the product"
        '@type':
          type: "string"
          description: "When sub-classing, this defines the sub-class entity name"
          default: "ProductRef"
    PhysicalProduct:
      description: "A child of product representing a tangible product"
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "PhysicalProduct"
    ShipmentProduct:
      description: "A child of product representing a shipment offer that is related to a PhysicalProduct"
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "ShipmentProduct"
    Offer:
      description: "A child of product representing an offer."
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "Offer"
    SimCard:
      description: "A child of product representing a SimCard."
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "SimCard"
    MobileLine:
      description: "A child of product representing a MobileLine."
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "MobileLine"
    Service:
      description: "A child of product representing a Service"
      allOf:
        - $ref: '#/components/schemas/Product'
        - type: object
          properties:
            '@type':
              type: "string"
              default: "Service"
    ProductRefOrValue:
      description: "A product to be created defined by value or existing defined by\
        \ reference. The polymorphic attributes @type, @schemaLocation & @referredType\
        \ are related to the product entity and not the RelatedProductRefOrValue class\
        \ itself"
      type: "object"
      oneOf:
        - $ref: "#/components/schemas/Product"
        - $ref: "#/components/schemas/ProductRef"
      discriminator:
        propertyName: "@type"
        mapping:
          Product: "#/components/schemas/Product"
          PhysicalProduct: "#/components/schemas/PhysicalProduct"
          ShipmentProduct: "#/components/schemas/ShipmentProduct"
          Offer: "#/components/schemas/Offer"
          SimCard: "#/components/schemas/SimCard"
          MobileLine: "#/components/schemas/MobileLine"
          Service: "#/components/schemas/Service"
          ProductRef: "#/components/schemas/ProductRef"
    ProductRelationship:
      description: "Linked products to the one instantiate, such as [bundled] if the\
        \ product is a bundle and you want to describe the bundled products inside\
        \ this bundle; [reliesOn] if the product needs another already owned product\
        \ to rely on (e.g. an option on an already owned mobile access product) [targets]\
        \ or [isTargeted] (depending on the way of expressing the link) for any other\
        \ kind of links that may be useful"
      required:
        - "relationshipType"
        - "product"
      type: "object"
      properties:
        relationshipType:
          type: "string"
          description: Type of relation ship
        product:
          $ref: "#/components/schemas/ProductRefOrValue"
    ProductSpecificationRef:
      description: "Product specification reference: A ProductSpecification is a detailed\
        \ description of a tangible or intangible object made available externally\
        \ in the form of a ProductOffering to customers or other parties playing a\
        \ party role."
      required:
        - "id"
        - "@type"
      type: "object"
      properties:
        id:
          description: "Unique identifier of a related entity."
          type: "string"
        href:
          description: "Reference of the related entity."
          type: "string"
        name:
          description: "Name of the related entity."
          type: "string"
        version:
          description: "Version of the product specification"
          type: "string"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
          minLength: 1
        '@referredType':
          description: "The actual type of the target instance when needed for disambiguation."
          type: "string"
    ProductStatusType:
      description: "Possible values for the status of the product"
      type: "string"
      enum:
        - "Aborted"
        - "Active"
        - "Cancelled"
        - "Created"
        - "Terminated"
        - "Sold"
    ProductTerm:
      description: "Description of a productTerm linked to this product. This represent\
        \ a commitment with a duration"
      type: "object"
      properties:
        description:
          description: "Description of the productTerm"
          type: "string"
        name:
          description: "Name of the productTerm"
          type: "string"
        duration:
          $ref: "#/components/schemas/Duration"
        validFor:
          $ref: "#/components/schemas/TimePeriod"
    Quantity:
      description: "An amount in a given unit"
      type: "object"
      properties:
        amount:
          description: "Numeric value in a given unit"
          type: "number"
          format: "float"
          default: 1
        units:
          description: "Unit"
          type: "string"
    Duration:
      description: "An amount in a given unit"
      type: "object"
      properties:
        amount:
          description: "Numeric value in a given unit"
          type: integer
          format: int32
        units:
          description: "Unit"
          type: "string"
    RelatedPlaceRefOrValue:
      description: "Related Entity reference. A related place defines a place described\
        \ by reference or by value linked to a specific entity. The polymorphic attributes\
        \ @type, @schemaLocation & @referredType are related to the place entity and\
        \ not the RelatedPlaceRefOrValue class itself\n\n\n\n\n\n**Inheritance**\n\
        \n  Children:\n  - GeographicAddress"
      required:
        - "role"
      type: "object"
      properties:
        id:
          description: "Unique identifier of the place"
          type: "string"
        href:
          description: "Unique reference of the place"
          type: "string"
        name:
          description: "A user-friendly name for the place, such as [Paris Store],\
            \ [London Store], [Main Home]"
          type: "string"
        role:
          type: "string"
          description: "role of the place"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
        '@referredType':
          description: "The actual type of the target instance when needed for disambiguation."
          type: "string"
    RelatedProductOrderItem:
      description: "RelatedProductOrderItem (ProductOrder item) .The product order\
        \ item which triggered product creation/change/termination."
      required:
        - "orderItemId"
        - "productOrderId"
      type: "object"
      properties:
        orderItemAction:
          description: "Action of the order item for this product"
          type: "string"
        orderItemId:
          description: "Identifier of the order item where the product was managed"
          type: "string"
        productOrderHref:
          description: "Reference of the related entity."
          type: "string"
        productOrderId:
          description: "Unique identifier of a related entity."
          type: "string"
        role:
          description: "role of the product order item for this product"
          type: "string"
        '@referredType':
          description: "The actual type of the target instance when needed for disambiguation."
          type: "string"
    ResourceRef:
      required:
        - "id"
      type: "object"
      description: "Reference to a resource"
      properties:
        id:
          description: "Unique identifier of a related entity."
          type: "string"
        href:
          description: "Reference of the related entity."
          type: "string"
        name:
          description: "Name of the resource"
          type: "string"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
        '@referredType':
          description: "The actual type of the target instance when needed for disambiguation."
          type: "string"
    ServiceRef:
      description: "Service reference, for when Service is used by other entities"
      required:
        - "id"
      type: "object"
      properties:
        id:
          description: "Unique identifier of a related entity."
          type: "string"
        href:
          description: "Reference of the related entity."
          type: "string"
        name:
          description: "Name of the related entity."
          type: "string"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
        '@referredType':
          description: "The actual type of the target instance when needed for disambiguation."
          type: "string"
    StatusChange:
      type: "object"
      description: "represents a status change at some time"
      properties:
        changeDate:
          type: "string"
          description: "date that the change happened"
          format: "date-time"
        changeReason:
          type: "string"
          description: "reason that the change happened"
        status:
          $ref: "#/components/schemas/ProductStatusType"
        '@type':
          type: "string"
          description: "type of StatusChange"
        '@referredType':
          description: "referredType type of StatusChange"
          type: "string"
    JobSpecificationStatusChange:
      type: "object"
      description: "represents a status change at some time for JobSpecification"
      properties:
        changeDate:
          type: "string"
          description: "date that the change happened"
          format: "date-time"
        lifecycleStatus:
          $ref: "#/components/schemas/JobSpecificationStatusType"
        '@type':
          type: "string"
          description: "type of StatusChange"
        '@referredType':
          description: "referredType type of StatusChange"
          type: "string"
    StringArrayCharacteristic:
      description: "\n\n**Polymorphism**\n\n  Parent: Characteristic\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Characteristic"
        - type: "object"
          properties:
            value:
              type: "array"
              items:
                type: "string"
    StringCharacteristic:
      description: "\n\n**Polymorphism**\n\n  Parent: Characteristic\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Characteristic"
        - type: "object"
          properties:
            value:
              type: "string"
    TimePeriod:
      description: "A period of time, either as a deadline (endDateTime only) a startDateTime\
        \ only, or both"
      type: "object"
      properties:
        endDateTime:
          description: "End of the time period, using IETF-RFC-3339 format"
          type: "string"
          format: "date-time"
        startDateTime:
          description: "Start of the time period, using IETF-RFC-3339 format. If you\
            \ define a start, you must also define an end"
          type: "string"
          format: "date-time"
    DatePeriod:
      description: "A period of time, either as a deadline (endDateTime only) a startDateTime\
        \ only, or both"
      type: "object"
      properties:
        endDate:
          description: "End of the time period"
          type: "string"
          format: "date"
        startDate:
          description: "Start of the time period"
          type: "string"
          format: "date"
    ServiceStatus:
      description: "An object representing the response status of the service"
      type: "object"
      properties:
        serviceName:
          description: "the Service Name"
          type: "string"
        version:
          description: "the Service version"
          type: "string"
        message:
          description: "the status response message "
          type: "string"
    ServiceVersion:
      description: "An object containing the version of the  service"
      type: "object"
      properties:
        version:
          description: "the Service version"
          type: "string"
    JobReportProductRef:
      description: "An object containing the download link of an export file"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/ProductRef"
      properties:
        externalIdentifier:
          type: "string"
          description: "Reference of the id of an entity from an external system "
        failReason:
          type: "string"
          description: "the error mesage"
    ExportFileInformation:
      description: "An object containing the download link of an export file"
      type: "object"
      allOf:
        - $ref: "#/components/schemas/FileInformation"
      properties:
        completionDate:
          description: "The CompletionDate of the export"
          type: "string"
          format: "date-time"
    FileInformation:
      description: "An object containing File information"
      type: "object"
      properties:
        url:
          description: "The download url "
          type: "string"
        contentType:
          $ref: '#/components/schemas/ContentTypeEnum'
        validFor:
          $ref: "#/components/schemas/TimePeriod"
    PurgeTypeEnum:
      type: string
      enum:
        - "PurgeProduct"
        - "PurgeJob"
      description: "Represents the type of what to purge. Depending on the `purgeType` value, different parameters and values of `query` attribute are required:\n
         - For `PurgeProduct`: At least one of the query parameters (`creationDate.lte`, `creationDate.gte`,`terminationDate.lte`, `terminationDate.gte`, `startDate.lte`, `startDate.gte`, `status`) must be provided, and the status values must be one of `Cancelled`, `Aborted`, `Terminated`.\n
        - For `PurgeJob`: At least one of the query parameters (`creationDate.lte`, `creationDate.gte`, `status`) must be provided, and the status values must be one of `Done`, `TerminatedWithError`."
    RelatedPartyOrPartyRole:
      description: "RelatedParty reference. A related party defines party or party role or its reference,linked to a specific entity"
      type: "object"
      properties:
        '@type':
          type: string
          default: "RelatedPartyRefOrPartyRoleRef"
        "role":
          type: "string"
          description: "Role played by the related party or party role in the context of the specific entity it is linked to. Such as 'initiator', 'customer',  'salesAgent', 'user'"
          format: "string"
        "partyOrPartyRole":
          "$ref": '#/components/schemas/PartyOrPartyRole'
    PartyOrPartyRole:
      type: object
      description: ''
      oneOf:
        - $ref: '#/components/schemas/PartyRef'
        - $ref: '#/components/schemas/PartyRoleRef'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    PartyRef:
      type: object
      description: A Party reference
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
      properties:
        '@type':
          type: string
          default: "PartyRef"
        id:
          type: string
          description: The identifier of the PartyRef.
        href:
          type: string
          description: The URI of the PartyRef.
        name:
          type: string
          description: Name of the PartyRef.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
    PartyRoleRef:
      type: object
      description: Party role reference. A party role represents the part played by a party in a given context.
      properties:
        '@type':
          type: string
          default: "PartyRoleRef"
        id:
          type: string
          description: The identifier of the PartyRef.
        href:
          type: string
          description: The URI of the PartyRef.
        name:
          type: string
          description: Name of the PartyRef.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
        partyId:
          type: string
          description: The identifier of the engaged party that is linked to the PartyRole object.
        partyName:
          type: string
          description: The name of the engaged party that is linked to the PartyRole object.
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    Report:
      description: "A generic report entity that can represent various types of reports."
      discriminator:
        propertyName: "@type"
        mapping:
          ReportProductByStatus: "#/components/schemas/ReportProductByStatus"
          ReportProductByOffer: "#/components/schemas/ReportProductByOffer"
      type: "object"
      properties:
        id:
          description: "Unique identifier of the report."
          type: "string"
        href:
          description: "Reference URL of the report."
          type: "string"
        '@type':
          description: "Defines the sub-class entity name when sub-classing."
          type: "string"
          default: "Report"
        collectDate:
          description: "The date for which the report is generated."
          type: "string"
          format: "date"
        details:
          type: "array"
          items:
            $ref: "#/components/schemas/ReportDetails"
    ReportDetails:
      description: "the report details."
      type: "object"
      properties:
        count:
          type: integer
          format: int64
          description: The count of the specific characteristic.
        characteristic:
          type: "array"
          items:
            $ref: "#/components/schemas/ReportCharacteristic"
    ReportCharacteristic:
      description: "A name value report characteristic."
      type: "object"
      properties:
        name:
          type: string
          description: ""
        value:
          type: string
          description: ""
    ReportProductByStatus:
      description: "the status report type."
      type: "object"
      allOf:
        - $ref: "#/components/schemas/Report"
      properties:
        '@type':
          description: "Defines the sub-class entity name when sub-classing."
          type: "string"
          default: "ReportProductByStatus"
    ReportProductByOffer:
      description: "the offer report type."
      type: "object"
      allOf:
        - $ref: "#/components/schemas/Report"
      properties:
        '@type':
          description: "Defines the sub-class entity name when sub-classing."
          type: "string"
          default: "ReportProductByOffer"
    ReportGranularity:
      type: string
      enum:
        - "Day"
        - "Week"
        - "Month"
        - "Year"
      description:
        The granularity of the report data (day, week, month, year)
    ReportType:
      type: string
      enum:
        - "ReportProductByStatus"
        - "ReportProductByOffer"
      description:
        The type of the report data (StatusReport,...)
    MeasuredValue:
      description: "Represents a numeric value associated with a specific unit of measure."
      type: "object"
      properties:
        amount:
          description: "Numeric value in a given unit"
          type: "number"
          format: "float"
        units:
          description: "Unit of measure (e.g., months, USD, GB)"
          type: "string"