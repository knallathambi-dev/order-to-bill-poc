openapi: "3.0.0"
info:
  description: "The Product Inventory (PI) is considered as a standalone\
    \ component that stores all Products and the subsequent Product Prices.\n\nIt\
    \ exposes TMF open API interfaces to enable commercial installed base creation,\
    \ consultation and update the Product Inventory Management API TMF637.\n\n"
  version: "0.23.0"
  title: "Product Inventory Management"
security:
  - bearerAuth: [ ]
tags:
  - name: "Product"
  - name: "JobSpecification"
  - name: "Job"
  - name: "Status"
  - name: "Version"
  - name: "Configuration"
  - name: "Reporting"

servers:
  - url: "https://serverRoot"

paths:
  /productInventoryManagement/v1/product:
