components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ExportJobSpecification:
      description: "\n\n**Polymorphism**\n\n  Parent: JobSpecification\n\n  Discriminator:\
        \ @type"
      required:
        - contentType
        - query
      allOf:
        - $ref: "#/components/schemas/JobSpecification"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "ExportJobSpecification"
            contentType:
              $ref: '#/components/schemas/ContentTypeEnum'
            query:
              type: string
            fields:
              type: array
              items:
                type: string
                description: fields selected.
    TerminationJobSpecification:
      description: "\n\n**Polymorphism**\n\n  Parent: JobSpecification\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/JobSpecification"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "TerminationJobSpecification"
    PurgeJobSpecification:
      description: "\n\n**Polymorphism**\n\n  Parent: JobSpecification\n\n  Discriminator:\
        \ @type"
      required:
        - purgeType
        - query
      allOf:
        - $ref: "#/components/schemas/JobSpecification"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "PurgeJobSpecification"
            purgeType:
              $ref: '#/components/schemas/PurgeTypeEnum'
            query:
              type: string
    ImportJobSpecification:
      description: "\n\n**Polymorphism**\n\n  Parent: JobSpecification\n\n  Discriminator:\
        \ @type"
      required:
        - importType
      allOf:
        - $ref: "#/components/schemas/JobSpecification"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "ImportJobSpecification"
            importType:
              $ref: '#/components/schemas/ImportTypeEnum'
            contentType:
              $ref: '#/components/schemas/ContentTypeEnum'
            checkCatalog:
              type: boolean
              default: false
    JobSpecificationRef:
      description: "reference to a jobSpecification"
      discriminator:
        propertyName: "@type"
      required:
        - "id"
        - "@type"
      type: "object"
      properties:
        id:
          type: "string"
          description: "Unique identifier of jobSpecification"
        href:
          type: "string"
          description: "Reference of the jobSpecification"
        '@type':
          type: "string"
          description: "When sub-classing, this defines the sub-class entity name"
          default: null
    JobSpecification:
      description: "Represents a job specification entity, which encapsulates information about a specific job specification.\
        \ job specifications are job specifications or processes that need to be executed, each with its own unique characteristics.\
        \ This DTO includes details such as the job specification's unique identifier, name, type, status, start date, end date,\
        \ and a list of processed Job Specifications associated with the job specification."
      type: "object"
      properties:
        id:
          type: string
          description: The unique identifier for the job specification.
        name:
          type: string
          description: The name of the job specification.
        '@type':
          description: The type of the job specification.
          type: string
          default: null
        '@baseType':
          description: The base type of the job specification.
          type: string
          default: null
        href:
          type: string
          description: The reference link to the job specification.
        lifecycleStatus:
          $ref: '#/components/schemas/JobSpecificationStatusType'
        lifeCycleStatusChange:
          type: array
          items:
            $ref: "#/components/schemas/JobSpecificationStatusChange"
        activePeriod:
          $ref: '#/components/schemas/TimePeriod'
        creationDate:
          type: string
          format: date-time
          description: The creation date and time of the job specification."
        schedule:
          $ref: '#/components/schemas/JobScheduler'
      discriminator:
        propertyName: "@type"
        mapping:
          JobSpecification: "#/components/schemas/JobSpecification"
          ExportJobSpecification: "#/components/schemas/ExportJobSpecification"
          TerminationJobSpecification: "#/components/schemas/TerminationJobSpecification"
          PurgeJobSpecification: "#/components/schemas/PurgeJobSpecification"
          ImportJobSpecification: "#/components/schemas/ImportJobSpecification"
    ProductCount:
      description: Represents the product count
      type: object
      properties:
        status:
          type: string
          description : status of Product Count
        count:
          type: integer
          description : count of Product Count
    JobScheduler:
      description: "Represents a JobScheduler entity"
      type: object
      properties:
        '@type':
          type: string
          description: type of JobScheduler
      required:
        - "@type"
      discriminator:
        propertyName: "@type"
        mapping:
          OneTimeJobScheduler: "#/components/schemas/OneTimeJobScheduler"
          RecurringJobScheduler: "#/components/schemas/RecurringJobScheduler"
          ImmediateJobScheduler: "#/components/schemas/ImmediateJobScheduler"
    OneTimeJobScheduler:
      description: "subType of job specification schedule, for a job specification that occurs only once in the future"
      allOf:
        - $ref: "#/components/schemas/JobScheduler"
        - type: object
          properties:
            plannedDate:
              type: string
              format: date-time
              description: Exact date and time when the job specification should be executed (for one-time job specifications).
              example: 2024-09-01T12:00:00Z
            '@type':
              type: string
              default: "OneTimeJobScheduler"
          required:
            - "plannedDate"
    ImmediateJobScheduler:
      description: "subType of job specification schedule, for a job specification that occurs only once and Immediately"
      allOf:
        - $ref: "#/components/schemas/JobScheduler"
        - type: object
          properties:
            '@type':
              type: string
              default: "ImmediateJobScheduler"
    RecurringJobScheduler:
      description: "subType of job specification schedule, for a job specification that is recurring"
      allOf:
        - $ref: "#/components/schemas/JobScheduler"
        - type: object
          properties:
            frequency:
              $ref: "#/components/schemas/JobFrequency"
            scheduledPeriod:
              $ref: "#/components/schemas/DatePeriod"
            executionTime:
              type: string
              format: time
              description: Time of day when the job specification should be executed (in UTC).
              example: 14:30:00
            '@type':
              type: string
              default: "RecurringJobScheduler"
          required:
            - "frequency"
            - "scheduledPeriod"
            - "executionTime"
    JobFrequency:
      description: "job Frequency"
      allOf:
        - type: object
          properties:
            amount:
              type: integer
              description: Number of times the job specification should repeat within a period.
              example: 3
            timePeriod:
              $ref: "#/components/schemas/TimePeriodType"
          required:
            - "amount"
            - "period"
    JobSpecificationStatusType:
      description: Type JobSpecification Status Enum.
      type: string
      enum:
        - "Created"
        - "Active"
        - "Suspended"
        - "Terminated"
    JobSchedulerType:
      type: string
      description: Type discriminator for the job specification schedule.
      enum:
        - "OneTimeJobScheduler"
        - "RecurringJobScheduler"
        - "ImmediateJobScheduler"
    TimePeriodType:
      type: string
      description: Unit of time for the frequency.
      enum:
        - "Hour"
        - "Day"
        - "Week"
        - "Month"
        - "Year"
    ContentTypeEnum:
      type: string
      enum:
        - "json"
        - "csv"
      description:
        Represents the content type of the export file.
    ImportTypeEnum:
      type: string
      enum:
        - "merge"
        - "insert"
      description:
        Represents the content type of the export file.
    JobSpecificationType:
      type: string
      enum:
        - "TerminationJobSpecification"
        - "ExportJobSpecification"
        - "PurgeJobSpecification"
        - "ImportJobSpecification"
      description: >
        Represents the type of a job specification.
        Possible values include:
        - `TerminationJobSpecification`: The job specification is a batch job specification.
        - `ExportJobSpecification`: The job specification is an export job.
        - `PurgeJobSpecification`: The job specification is a purge job.
        - `ImportJobSpecification`: The job specification is an import job.
    ProductRelationshipType:
      type: string
      enum:
        - "bundles"
        - "sells"
        - "rootProduct"
        - "isChild"
        - "reliesOn"
        - "hasParent"
        - "reliesFrom"
        - "bundlesMigrate"
        - "reliesOnMigrate"
        - "migrateFrom"
      description: >
        Represents the type of relationship between products, such as [bundled] if the\
          \ product is a bundle and you want to describe the bundled products inside\
          \ this bundle; [reliesOn] if the product needs another already owned product\
          \ to rely on (e.g. an option on an already owned mobile access product)\
          \ [targets] or [isTargeted] (depending on the way of expressing the link)\
          \ for any other kind of links that may be useful
    Job:
      description: Represents the execution details of a specific job specification.
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the job.
        jobSpecification:
          $ref: '#/components/schemas/JobSpecificationRef'
        executionPeriod:
          $ref: "#/components/schemas/TimePeriod"
        plannedDate:
          type: string
          format: date-time
          description: The planned start date and time for the job.
        status:
          $ref: '#/components/schemas/JobStatusType'
        href:
          description: "Reference of the related entity."
          type: "string"
        errorLog:
          type: "string"
        '@type':
          description: The type of the job that reflect the same type as its parent job specification.
          type: string
          default: null
        '@baseType':
          description: "When sub-classing, this defines the super-class."
          type: "string"
      discriminator:
        propertyName: "@type"
        mapping:
          Job: "#/components/schemas/Job"
          ExportJob: "#/components/schemas/ExportJob"
          PurgeJob: "#/components/schemas/PurgeJob"
          TerminationJob: "#/components/schemas/TerminationJob"
          ImportJob: "#/components/schemas/ImportJob"
    ExportJob:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "ExportJob"
            'fileName':
              type: string
    PurgeJob:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "PurgeJob"
    TerminationJob:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/JobWithReports"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "TerminationJob"
    ImportJob:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/JobWithReports"
        - type: "object"
          properties:
            '@type':
              type: string
              default: "ImportJob"
            'fileName':
              type: string
    JobWithReports:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n"
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: "object"
          properties:
            failureReport:
              $ref: "#/components/schemas/JobExecutionReport"
            successReport:
              $ref: "#/components/schemas/JobExecutionReport"
    JobExecutionReport:
      description: "\n\n**Polymorphism**\n\n  Parent: Job\n\n  Discriminator:\
        \ @type"
      allOf:
        - type: "object"
          properties:
            'status':
              $ref: "#/components/schemas/ProductProcessStatusType"
            'products':
              type: array
              items:
                $ref: "#/components/schemas/JobReportProductRef"
    JobStatusType:
      type: string
      enum:
        - "NotStarted"
        - "Running"
        - "Succeeded"
        - "Failed"
      description: >
        Represents the possible statuses of a job.
        Possible values include:
        - `NotStarted`: The job has not started yet.
        - `Running`: The job is currently in progress.
        - `Succeeded`: The job has successfully completed.
        - `Failed`: The job was terminated due to an error.
    ProductProcessStatusType:
      type: string
      enum:
        - "Failed"
        - "Succeeded"
      description: >
        Represents the status of a processed product.
        Possible values include:
        - `Failed`: The processed product is failed.
        - `Completed`: the processed product is completed.
    JobTypeEnum:
      type: string
      enum:
