    BooleanArrayCharacteristic:
      description: "\n\n**Polymorphism**\n\n  Parent: Characteristic\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Characteristic"
        - type: "object"
          properties:
            value:
              type: "array"
              items:
                type: "boolean"
    BooleanCharacteristic:
      description: "\n\n**Polymorphism**\n\n  Parent: Characteristic\n\n  Discriminator:\
        \ @type"
      allOf:
        - $ref: "#/components/schemas/Characteristic"
        - type: "object"
          properties:
            value:
              type: "boolean"
    Characteristic:
      description: "Describes a given characteristic of an object or entity through\
        \ a name/value pair.\n\n\n\n\n\n**Polymorphism**\n\n  Discriminator: @type\n\
        \n  One of:\n  - BooleanCharacteristic\n  - IntegerCharacteristic\n  - ObjectCharacteristic\n\
        \  - ObjectArrayCharacteristic\n  - StringCharacteristic\n  - StringArrayCharacteristic\n\
        \  - NumberCharacteristic\n  - NumberArrayCharacteristic\n  - IntegerArrayCharacteristic\n\
        \  - BooleanArrayCharacteristic    \  - ValidityCharacteristic"
      discriminator:
        propertyName: "@type"
        mapping:
          BooleanCharacteristic: "#/components/schemas/BooleanCharacteristic"
          IntegerCharacteristic: "#/components/schemas/IntegerCharacteristic"
          ObjectCharacteristic: "#/components/schemas/ObjectCharacteristic"
          ObjectArrayCharacteristic: "#/components/schemas/ObjectArrayCharacteristic"
          StringCharacteristic: "#/components/schemas/StringCharacteristic"
          StringArrayCharacteristic: "#/components/schemas/StringArrayCharacteristic"
          NumberCharacteristic: "#/components/schemas/NumberCharacteristic"
          NumberArrayCharacteristic: "#/components/schemas/NumberArrayCharacteristic"
          IntegerArrayCharacteristic: "#/components/schemas/IntegerArrayCharacteristic"
          BooleanArrayCharacteristic: "#/components/schemas/BooleanArrayCharacteristic"
          ValidityCharacteristic: "#/components/schemas/ValidityCharacteristic"
          AddressCharacteristic: "#/components/schemas/AddressCharacteristic"
          DateCharacteristic: "#/components/schemas/DateCharacteristic"
      required:
        - '@type'
      type: "object"
      properties:
        id:
          type: "string"
          description: "identifier of characteristic"
        name:
          description: "Name of the characteristic"
          type: "string"
        valueType:
          description: "Data type of the value of the characteristic"
          type: "string"
        productCharacteristicRelationships:
          type: "array"
          description: "array of characteristics in relation"
          items:
            $ref: "#/components/schemas/CharacteristicRelationship"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name"
          type: "string"
    CharacteristicRelationship:
      required:
        - "id"
      type: "object"
      description: "represents a relation ship between characteristics"
      properties:
        id:
          description: "Identifier of characteristic"
          type: "string"
        relationshipType:
          description: "type of relationship"
          type: "string"
    Error:
      description: "Used when an API throws an Error, typically with a HTTP error\
        \ response-code (3xx, 4xx, 5xx)"
      required:
        - "code"
        - "reason"
      type: "object"
      properties:
        code:
          description: "Application relevant detail, defined in the API or a common\
            \ list."
          type: "string"
        reason:
          description: "Explanation of the reason for the error which can be shown\
            \ to a client user."
          type: "string"
        message:
          description: "More details and corrective actions related to the error which\
            \ can be shown to a client user."
          type: "string"
        status:
          description: "HTTP Error code extension"
          type: "string"
        referenceError:
          description: "URI of documentation describing the error."
          type: "string"
          format: "uri"
        '@baseType':
          description: "When sub-classing, this defines the super-class."
          type: "string"
        '@schemaLocation':
          description: "A URI to a JSON-Schema file that defines additional attributes\
            \ and relationships"
          type: "string"
          format: "uri"
        '@type':
          description: "When sub-classing, this defines the sub-class entity name."
          type: "string"
    Config:
      description: "Response object containing the system configuration details."
      type: "object"
      properties:
        paginationLimit:
          description: "The maximum number of products that can be fetched or counted in the product listing API. Requests for offsets exceeding this limit will result in an error."
          type: "integer"
