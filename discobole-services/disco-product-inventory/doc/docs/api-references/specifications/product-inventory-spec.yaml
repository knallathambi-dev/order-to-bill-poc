          type: "string"
        resourceInventoryManagementUrl:
          description: "The URL of the resource inventory management service."
          type: "string"
        productCatalogEnabled:
          description: "Indicates whether the product catalog service is enabled. Possible values are 'true' or 'false'."
          type: "boolean"
        resourceInventoryManagementEnabled:
          description: "Indicates whether the resource inventory management service is enabled. Possible values are 'true' or 'false'."
          type: "boolean"
    ExternalIdentifier:
