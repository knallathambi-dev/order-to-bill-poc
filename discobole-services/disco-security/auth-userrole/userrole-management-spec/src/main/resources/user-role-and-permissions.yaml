openapi: "3.0.0"
info:
  description: "### Release 2.0.0 Dec 2024\n\n#### Goal\n\nThe user role and permissions\
    \ management API allows the management of the user roles, permissions, and privileges.\n\
    \n#### Operations\n\nThe DISCO implementation of Authorization API to manage users.\n\
    \n### TMF API Reference\n\nTMF672 User Roles & Permissions Management\n\n| User\
    \ Roles & Permissions Management API version |  TMF API version  |\n| -----------------------------------------------\
    \ |:-----------------:| \n| 1.0.0                                           |\
    \  4.0.1            | \n| 2.0.0                                           |  4.0.1\
    \            | Added component in user role resource.\n| 2.1.0               \
    \                            |  4.0.1            | Aligned API Design\n"
  version: "2.1.0_release"
  title: "UserRolePermissionManagement"
