- name: "Permission"
- name: "UserRole"
- name: "Hub"
- name: "Listener"
- name: "Entitlement"
  description: "Manage a  entitlement"
- name: "ComponentConfiguration"
  description: "Exposes the list of components managed by the user role API"
- name: "FunctionConfiguration"
