spring:
  config:
    activate:
      on-profile: openshift
  data:
    mongodb:
      delete: true
      host: ${DB_SERVICE}
      port: 27017
      database: ${DB_NAME}
      username: ${DATABASE_USER}
      password: ${DATABASE_PASSWORD}
      
  keycloakUrl: ${KEYCLOAK_SERVICE_ROUTE}
  keycloakclientId: ${KEYCLOAKCLIENTID}
  realm: ${KEYCLOAK_REALM}
  keycloakRolesEntitlements: x107
  keycloakAuthUrl: ${KEYCLOAK_SERVICE_ROUTE}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
  userRoleRetrievalUrl: ${AUTH_USERROLE_ROUTE}/userRolePermission/v1/userRole
  keycloak: ${KEYCLOAK_SERVICE_ROUTE}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
  admin-role: authUserRoleAdmin
logging:
  level:
    com.orange.role: DEBUG