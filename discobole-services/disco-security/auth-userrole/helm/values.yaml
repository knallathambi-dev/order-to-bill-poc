# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# -- Application replica count
replicaCount: 1

# -- Enable or disable application daily shutdown
dailyshutdown: enabled

# -- Keystore in P12 format, base64 encoded
keyStoreP12: ""

# -- Application container image configuration
image:
  repository: "${docker_repository}"
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "${docker_tag}"

# -- Specify pulling image secrets if your image repository requires it
imagePullSecrets: []

# -- Override default fully qualified app name and chart name
nameOverride: ""

# -- Override fully qualified app name
fullnameOverride: ""

# Specifies whether a service account should be created
serviceAccount:
  # -- specifies whether a service account should be created
  create: false
  # -- annotations to add to the service account
  annotations: {}
  # -- the name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Enable monitoring and supervision of pods
podAnnotations: {}
  #prometheus.io/port: '9000'
  #prometheus.io/scrape: 'true'
  #metrics: '/actuator/prometheus'

# -- Security context for the containers
podSecurityContext: {}
  # fsGroup: 1000
  # runAsNonRoot: true

# -- Security context
securityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: true
  # runAsGroup: 1000
  # runAsNonRoot: true
  # runAsUser: 1000
  # capabilities:
  #   drop:
  #   - ALL

# Service configuration
service:
  type: ClusterIP
  port: 8080
  # -- enable monitoring and supervision of service
  annotations: {}
  #  prometheus.io/port: '9000'
  #  prometheus.io/scrape: 'true'

# Ingress configuration
ingress:
  # -- Enable ingress controller
  enabled: false
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"   
  # -- host names for the ingress controller
  hosts:
    ## -- host names for the ingress controller
    - host: ""
      paths: [/] # align with contextPath

# Horizontal Pod Autoscaler configuration
autoscaling:
  # -- Enable Horizontal Pod Autoscaler
  enabled: false
  # -- Minimum number of pod replicas
  minReplicas: ""
  # -- Maximum number of pod replicas
  maxReplicas: ""
  # -- Target CPU utilization percentages for pod scaling
  targetCPUUtilizationPercentage: ""
  # -- Target Memory utilization percentages for pod scaling
  targetMemoryUtilizationPercentage: ""

# -- Node selectorfor pod assignment
nodeSelector: {}

# -- Node tolerations for pod assignment
tolerations: []

# -- Node affinity for pod assignment
affinity: {}

# OpenTelemetry configuration
otel:
  # -- activate Open Telemetry instrumentation
  enabled: false
  sidecar:
    # -- use collector agent sidecar
    enabled: false
    # -- main collector address
    jaeger:
      # collector host
      host: ""
      # collector port
      port: 14250
    # main receiver address
    otlp:
      # receiver host
      host: ""
      # receiver port
      port: 4317
  # resource attributes to be set on telemetry data
  attributes:
    # -- resource attribute to be set on telemetry data
    platform: ""
    # -- resource attribute to be set on telemetry data
    region: ""
    # -- resource attribute to be set on telemetry data
    cluster: ""
    # -- resource attribute to be set on telemetry data
    namespace: ""
    # -- resource attribute to be set on telemetry data
    hostname: ""

# fluentd sidecar for logs forwarding
fluentd:
  # -- enable fluentd sidecar container
  enabled: false
  # -- tag value being set on log events and used by fluentd to route logs
  tag: "" 
  # -- hostname of the fluentd instance this application should send logs to. Defaults to localhost
  host: ""

# Monitoring values
monitoring:
  # -- label to specify application monitoring
  application: ""
  domain: ""
  # -- label to specify product name (chart name by default)
  productName: ""
  # -- label to specify topology
  topology: ""
  # -- label to specify role
  role: ""
  # -- label for environment being deployed
  environment: ""

# -- Enable Promtail sidecar for Loki log aggregation
promtail:
  enabled: false

# Default resource requests and limits for the application container
resources:
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # -- resource requests
  requests:
    cpu: 100m
    memory: 128Mi
  # -- resource limits      
  limits:
    cpu: 200m
    memory: 1024Mi

# Default hostnames and ports of dependent services
services:
  # -- hostnames and ports of dependent services
  mongodb: auth-userrole-mongo
  # -- Mongo database name
  dbname: userRoleManagement
  # -- Kafka connection options
  kafka: kafka:9092
  # -- -- Keycloak connection options
  keycloak: keycloak:80
  # -- Keycloak realm
  keycloakrealm: SpringBootKeycloak
  # catalog UI service
  catalogui: catalog-ui:80
  # -- dependent microservice
  productcatalog: catalog-product-catalog:8080
  # -- dependent microservice
  specification: catalog-product-specification:8080
  # -- dependent microservice
  offering: catalog-product-offering:8080
  # -- dependent microservice
  offeringprice: catalog-product-offering-price:8080
  # -- dependent microservice
  category: catalog-product-category:8080
  # -- dependent microservice
  lifecycle: catalog-product-lifecycle-management:8080
  # -- dependent microservice
  mockservice: mock-server:80
  # -- dependent microservice
  gateway: disco-gateway:8080
  # -- keycloak service route
  keycloakroute: keycloak
  keycloakserviceroute: https://keycloak
  # -- auth-userrole service route
  authuserroleroute: https://auth-userrole

# -- Context path for the application
contextPath: ""

# Mongo database configuration 
database:
  # -- enable or disable authentication
  enabled: true
  # -- database root user credentials
  rootPassword: "" # to define
  rootUser: "mongo_user"

# MongoDB configuration
mongo:
  # -- enable or disable mongoDB deployment
  enabled: true
  # -- mongoDB configuration  
  fullnameOverride: auth-userrole-mongo
  resources:
    limits:
      cpu: 500m
      memory: 2Gi
    requests:
      cpu: 200m
      memory: 1Gi
    # -- database custom user
  customUsers:
    - name: mongo_user
      database: userRoleManagement
      roles: 
        - "readWrite"
        - "dbAdmin"
      password: "" # to define
  auth:
    # -- enable or disable mongoDB authentication
    enabled: false
    # -- mongoDB root password
    rootPassword: "" # to define
    # -- mongoDB root user
    rootUsername: "mongo_user"
  # -- mongoDB persistence configuration
  persistence:
    enabled: true
    size: 4Gi
  # -- hidden mongoDB persistence configuration
  hidden:
    persistence:
      size: 4Gi
  # -- mongoDB  service configuration
  service:
    type: ClusterIP
    port: 27017


# -- Keycloak configuration
keycloak:
  # -- enable or disable keycloak integration
  enabled: false
  # -- keycloak client id
  clientSecret: ""
  # -- keycloak url
  issuerURI: ""

# -- DISCOBOLE gateway configuration
gateway:
  # -- Keycloak client ID
  id: ""
