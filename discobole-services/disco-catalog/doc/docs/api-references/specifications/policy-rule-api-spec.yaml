        type: "array"
        items:
          $ref: "#/definitions/RelatedPlaceRefOrValue"
      '@baseType':
        description: "The base type of this alarm."
        type: "string"
      '@schemaLocation':
        description: "A reference to the schema describing this alarm."
        type: "string"
