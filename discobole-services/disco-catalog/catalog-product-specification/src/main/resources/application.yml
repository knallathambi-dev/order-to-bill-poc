      import-check:
        enabled: false
  data:
    mongodb:
      host: localhost
      port: 27017  
      database: catalog
      username: root
      password: root
  keycloak: https://keycloak-integration-disco.apps.prd1.c1.paas.tech.orange/realms/SpringBootKeycloak/protocol/openid-connect/certs
