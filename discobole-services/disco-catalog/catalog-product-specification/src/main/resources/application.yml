          servlet:
            DispatcherServlet: WARN
            FrameworkServlet: WARN
            mvc:
              method:
                annotation:
                  RequestResponseBodyMethodProcessor: WARN
    com:
      orange:
        discobole:
          productcatalog:
            productspecification: DEBUG
    

