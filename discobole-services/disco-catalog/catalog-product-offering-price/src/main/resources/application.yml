    root: info
    java:
      util:
        logging: OFF
    org:
      apache:
        catalina: OFF
        juli:
          logging:
            DirectJDKLog: OFF
      springframework:
        web:
          servlet:
            DispatcherServlet: WARN
            FrameworkServlet: WARN
            mvc:
              method:
                annotation:
                  RequestResponseBodyMethodProcessor: WARN
    com:
      orange:
        discobole:
          productcatalog:
            productofferingprice: DEBUG

