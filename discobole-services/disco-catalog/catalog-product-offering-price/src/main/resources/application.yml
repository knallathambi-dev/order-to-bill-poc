spring:
  cloud:
    function:
      definition: handle
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    stream:
      kafka.binder:
        brokers: localhost
        defaultBrokerPort: 9092
        auto-add-partitions: true
        auto-create-topics: true
      default:
        contentType: application/json
      bindings:
        productOfferingPrice-out-0:
          contentType: application/json
          destination: catalog.product-offering-price
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
        handle-out-0:
          contentType: application/json
          destination: envelope
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
      default-binder: kafka
  zipkin:
    discoveryClientEnabled: false
  sleuth:
    enabled: true
    sampler:
      probability: 0.0
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  main:
    allow-bean-definition-overriding: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web.exposure.include: health, metrics, prometheus
  metrics:
    tags:
      application: catalog-product-offering-price
    distribution:
      percentiles-histogram:
        http.server.requests: true
  server:
    port: 9000
resilience4j.retry:
  instances:
    configuratorRetry:
      max-attempts: 3
      wait-duration: 500ms
      retry-exceptions:
        # This is the one thrown by your custom error handler for 5xx errors.
        - com.orange.discobole.productcatalog.productofferingprice.exception.DiscoClientException
        # This is for network-level errors (e.g., connection refused, host not found).
        - org.springframework.web.client.ResourceAccessException

retry:
  maxAttempts: '3'
  maxDelay: '1000'


app:
  version: @project.version@
  name: @project.name@
  description: @project.description@
  ownerName: Herve Bouvier
  ownerMail: herve.bouvier@orange.com

process-flow:
  role:
    admin: disco-admin

cqrs:
  command-enabled: true
  query-enabled: false
  queryBaseUrl: http://localhost:8087

config:
  productOfferingPriceUrl: http://localhost:8087/productCatalogManagement/v1/productOfferingPrice
  productOfferingUrl: http://localhost:8087/productCatalogManagement/v1/productOffering
  currencyUrl: http://localhost:8080/productCatalogAdministration/v5/currency
  frequencyUrl: http://localhost:8080/productCatalogAdministration/v5/frequencyTypes
cron:
  productOfferingPriceExpression: 0 17 13 * * ?
  jobInterval: 12
  intervalUnit: HOURS
  job-enabled: true

package-element:
  state-machines:
    - name: ProductOfferingPriceCreation
      states:
        - name: FORK
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: FORK
        - name: REGION
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: INITIAL
        - name: productOfferingPriceCancel
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion2
          pseudoStateKind: INITIAL
        - name: terminateFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion2
          pseudoStateKind: END
        - name: selectPOPType
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind: INITIAL
        - name: decisionTask1
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind: CHOICE
        - name: defineProductOfferingPriceChargeIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind:
        - name: defineProductOfferingPriceAlterationIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind:
        - name: defineProductOfferingPriceTaxAlterationIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind:
        - name: defineProductOfferingPriceInstallmentChargeIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind:
        - name: done
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind: END
        - name: JOIN
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: JOIN
        - name: endFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind:
          end: true
      transitions:
        - event:
          source: FORK
          target: REGION
          actions:
          guard:
          kind:
        - event:
          source: REGION
          target: productOfferingPriceCancel
          actions:
          guard:
          kind: EXTERNAL
        - event: endPOPCancelFlow
          source: productOfferingPriceCancel
          target: terminateFLow
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: REGION
          target: selectPOPType
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: selectPOPType
          target: decisionTask1
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: decisionTask1
          target: defineProductOfferingPriceChargeIdentityData
          actions:
          guard: isPriceTypePOPC
          kind: EXTERNAL
        - event:
          source: decisionTask1
          target: defineProductOfferingPriceAlterationIdentityData
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: decisionTask1
          target: defineProductOfferingPriceTaxAlterationIdentityData
          actions:
          guard: isPriceTypeTax
          kind: EXTERNAL
        - event:
          source: decisionTask1
          target: defineProductOfferingPriceInstallmentChargeIdentityData
          actions:
          guard: isPriceTypeInstallment
          kind: EXTERNAL
        - event: alterationIdentityDataDefined
          source: defineProductOfferingPriceAlterationIdentityData
          target: done
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event: chargeIdentityDataDefined
          source: defineProductOfferingPriceChargeIdentityData
          target: done
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event: taxIdentityDataDefined
          source: defineProductOfferingPriceTaxAlterationIdentityData
          target: done
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event: installmentIdentityDataDefined
          source: defineProductOfferingPriceInstallmentChargeIdentityData
          target: done
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: REGION
          target: JOIN
          actions:
          guard:
          kind:
        - event:
          source: JOIN
          target: endFlow
          actions:
          guard:
          kind: EXTERNAL
    - name: ProductOfferingPriceModification
      states:
        - name: OUTERFORK
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region
          pseudoStateKind: FORK
        - name: OUTERREGION
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region
          pseudoStateKind: INITIAL
        - name: productOfferingPriceModificationCancel
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region2
          pseudoStateKind: INITIAL
        - name: terminateFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region2
          pseudoStateKind: END
        - name: selectPOPTypeForModification
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region1
          pseudoStateKind: INITIAL
        - name: selectPOP
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region1
          pseudoStateKind: INITIAL
        - name: FORK
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region1
          pseudoStateKind: FORK
        - name: INNERREGION
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region1
          pseudoStateKind: INITIAL
        - name: modifyPOPChargeIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion1
          pseudoStateKind: INITIAL
        - name: POPChargeIdentityDataModified
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion1
          pseudoStateKind: END
        - name: modifyPOPAlterationIdentityData
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion2
          pseudoStateKind: INITIAL
        - name: POPAlterationIdentityDataModified
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion2
          pseudoStateKind: END
        - name: modifyRelationship
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion3
          pseudoStateKind: INITIAL
        - name: RelationshipModified
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion3
          pseudoStateKind: END
        - name: modifyPOPStatusValidityPeriod
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion4
          pseudoStateKind: INITIAL
        - name: POPStatusValidityPeriodModified
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion4
          pseudoStateKind: END
        - name: validate
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion5
          pseudoStateKind: INITIAL
          editable: false
        - name: validated
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: INNERREGION
          regionId: SubRegion5
          pseudoStateKind: END
        - name: JOIN
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: OUTERREGION
          regionId: Region1
          pseudoStateKind: JOIN
        - name: endFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind:
          end: true
        - name: OUTERJOIN
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region
          pseudoStateKind: JOIN
        - name: outerEndFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region
          pseudoStateKind:
          end: true
      transitions:
        - event:
          source: OUTERFORK
          target: OUTERREGION
          actions:
          guard:
          kind:
        - event:
          source: OUTERREGION
          target: productOfferingPriceModificationCancel
          actions:
          guard:
          kind: EXTERNAL
        - event: endPOPCancelFlow
          source: productOfferingPriceModificationCancel
          target: terminateFLow
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: OUTERREGION
          target: selectPOPTypeForModification
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: selectPOPTypeForModification
          target: selectPOP
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: selectPOP
          target: FORK
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: FORK
          target: INNERREGION
          actions:
          guard:
          kind:
        - event:
          source: INNERREGION
          target: modifyPOPChargeIdentityData
          actions:
          guard: isPriceTypePOPC
          kind: EXTERNAL
        - event: POPChargeIdentityDataModified
          source: modifyPOPChargeIdentityData
          target: POPChargeIdentityDataModified
          actions:
          guard: isPriceTypePOPC
          kind: EXTERNAL
        - event:
          source: INNERREGION
          target: modifyPOPAlterationIdentityData
          actions:
          guard: isPriceTypePOPA
          kind: EXTERNAL
        - event: POPAlterationIdentityDataModified
          source: modifyPOPAlterationIdentityData
          target: POPAlterationIdentityDataModified
          actions:
          guard: isPriceTypePOPA
          kind: EXTERNAL
        - event:
          source: INNERREGION
          target: validate
          guard:
          kind: EXTERNAL
        - event: validated
          source: validate
          target: validated
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: INNERREGION
          target: JOIN
          actions:
          guard:
          kind:
        - event:
          source: JOIN
          target: endFlow
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: OUTERREGION
          target: OUTERJOIN
          actions:
          guard:
          kind:
        - event:
          source: OUTERJOIN
          target: outerEndFlow
          actions:
          guard:
          kind: EXTERNAL

Dotel:
