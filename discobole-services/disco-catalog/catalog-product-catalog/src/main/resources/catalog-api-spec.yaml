      - "inDesign"
      - "rejected"
      - "inTest"
      - "active"
      - "launched"
      - "unavailable"
      - "retired"
      - "obsolete"
  ProductSpecRelationshipType:
    description: "Relationship type for Product Specification"
    type: "string"
    enum:
      - "prerequisite"
      - "incompatible"
      - "reliesOn"
      - "reliesFrom"
  ProductOfferingRelationshipType:
    type: "string"
    enum:
      - "prerequisite"
      - "incompatible"
      - "add"
      - "nonPersistentBrings"
      - "brings"
      - "onSelect"
      - "onDeselect"
      - "onLoad"
      - "onRestore"
      - "aggregates"
      - "reliesOn"
      - "reliesFrom"
      - "diesWith"
      - "reincarnates"
  ProductOfferingType:
    type: "string"
    enum:
      - "Contract"
      - "BundleProductOffering"
      - "AtomicOffer"
  ProductOfferingLifecycle:
    description: "Product Offering Lifecycle status"
    type: "string"
    enum:
      - "inStudy"
      - "inDesign"
      - "rejected"
      - "inTest"
      - "active"
      - "launched"
      - "unavailable"
      - "retired"
      - "obsolete"
  PartyType:
    description: "Type of party"
    type: "string"
    enum:
