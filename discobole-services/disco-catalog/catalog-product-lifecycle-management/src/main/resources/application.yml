spring:
  cloud:
    function:
      definition: handle
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    stream:
      kafka.binder:
        brokers: localhost
        defaultBrokerPort: 9092
        auto-add-partitions: true
        auto-create-topics: true
      default:
        contentType: application/json
      bindings:
        handle-out-0:
          destination: envelope
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
        lifeCycleManagement-out-0:
          destination: catalog.lifecycle-management
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
 
      default-binder: kafka
  zipkin:
    discoveryClientEnabled: false
  sleuth:
    enabled: true
    sampler:
      probability: 0.0
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  main:
    allow-bean-definition-overriding: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web.exposure.include: health, metrics, prometheus
  metrics:
    tags:
      application: discobole-productcatalog-lifecycle-management
    distribution:
      percentiles-histogram:
        http.server.requests: true
  server:
    port: 9000
resilience4j.retry:
  instances:
    configuratorRetry:
      max-attempts: 3
      wait-duration: 500ms
      retry-exceptions:
        # This is the one thrown by your custom error handler for 5xx errors.
        - com.orange.discobole.productcatalog.lifecyclemanagement.exception.DiscoClientException
        # This is for network-level errors (e.g., connection refused, host not found).
        - org.springframework.web.client.ResourceAccessException

retry:
  maxAttempts: '3'
  maxDelay: '1000'
    
app:
  version: @project.version@
  name: @project.name@
  description: @project.description@
  ownerName: Herve Bouvier
  ownerMail: herve.bouvier@orange.com

process-flow:
  role:
    admin: disco-admin

cqrs:
  command-enabled: true
  query-enabled: false
  queryBaseUrl: http://localhost:8087

config:
  cfsQuery: http://localhost:8087/serviceCatalogManagement/v1/serviceSpecification
  productSpecQuery: http://localhost:8087/productCatalogManagement/v1/productSpecification
  marketUrl: http://localhost:3000/market
  channelUrl: http://localhost:3000/channel
  productOfferingUrl: http://localhost:8087/productCatalogManagement/v1/productOffering
  productOfferingPriceUrl: http://localhost:8087/productCatalogManagement/v1/productOfferingPrice
  stockItemTypeUrl: http://localhost:8087/serviceCatalogManagement/v1/stockItemType
  stockItemUrl: http://localhost:8087/serviceCatalogManagement/v1/stockItem
  categoryUrl: http://localhost:8087/productCatalogManagement/v1/category
  categoryEntityUrl: http://localhost:8087/productCatalogManagement/v1/categoryEntity
  cpibProductUrl: https://cpib-integration.apps.fr01.paas.tech.orange/productInventoryManagement/v1/product
  adminCPIBConfigUrl: http://localhost:8080/cpibConfiguration
  #expression: 0 50 21 * * ?
  

eventstore:
  host: localhost
  port: 1113
  username: admin
  password: changeit

package-element:
  state-machines:
    - name: ManageEntityLifecycle
      states:
        - name: FORK
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: FORK
        - name: REGION
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: INITIAL
        - name: lifecycleCancel
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion2
          pseudoStateKind: INITIAL
        - name: terminateFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion2
          pseudoStateKind: END
        - name: selectProductEntity
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind: INITIAL
        - name: updateStatus
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind:
        - name: done
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState: REGION
          regionId: SubRegion1
          pseudoStateKind: END
        - name: JOIN
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind: JOIN
        - name: endFLow
          entryActions:
          exitActions:
          stateActions:
          initialAction:
          parentState:
          regionId: Region1
          pseudoStateKind:
          end: true
      transitions:
        - event:
          source: FORK
          target: REGION
          actions:
          guard:
          kind:
        - event:
          source: REGION
          target: lifecycleCancel
          actions:
          guard:
          kind: EXTERNAL
        - event: endCancelFlow
          source: lifecycleCancel
          target: terminateFLow
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: REGION
          target: selectProductEntity
          actions:
          guard:
          kind: EXTERNAL
        - event: entitySelected
          source: selectProductEntity
          target: updateStatus
          actions:
          guard:
          kind: EXTERNAL
        - event: statusUpdated
          source: updateStatus
          target: done
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: REGION
          target: JOIN
          actions:
          guard:
          kind:
        - event:
          source: JOIN
          target: endFlow
          actions:
          guard:
          kind: EXTERNAL

Dotel:
  instrumentation:
    kafka:
      enabled: true
    spring-kafka:
      enabled: true
    messaging:
      experimental:
        receive-telemetry:
          enabled: false
CPIB:
  limit: 100
  offset: 0

---
spring:
  config:
    activate:
      on-profile: default
  cloud:
    config:
      import-check:
        enabled: false
  data:
    mongodb:
      host: localhost
      port: 27017  
      database: catalog
      username: root
      password: root
  keycloak: https://keycloak-integration-disco.apps.fr01.paas.tech.orange/realms/SpringBootKeycloak/protocol/openid-connect/certs
  keycloakRolesEntitlements: x100, x14, x15, x16, x17, x102, lc_w
  userRoleRetrievalUrl: https://auth-userrole-retrieve-integration-disco.apps.fr01.paas.tech.orange/userRolePermission/v1/userRoles
  keycloakAuthUrl: https://keycloak-integration-disco.apps.fr01.paas.tech.orange/realms/SpringBootKeycloak/protocol/openid-connect/auth
server:
  port: 8086
  tomcat:
    mbeanregistry:
      enabled: true
    accesslog:
      enabled: true
  
logging:
  level:
    
    root: info
    java:
      util:
        logging: OFF
    org:
      apache:
        catalina: OFF
        juli:
          logging:
            DirectJDKLog: OFF
      springframework:
        web:
          servlet:
            DispatcherServlet: WARN
            FrameworkServlet: WARN
            mvc:
              method:
                annotation:
                  RequestResponseBodyMethodProcessor: WARN
    com:
      orange:
        discobole:
          productcatalog:
            lifecyclemanagement: DEBUG
    

---
spring:
  config:
    activate:
      on-profile: test,cucumbertest

---
spring:
  config:
    activate:
      on-profile: cloud, orange-cf
  cloud:
    discovery:
      enabled: true
    service-registry:
      auto-registration:
        enabled: true
    stream:
      kafka.binder:
        brokers: ${vcap.services.kafka.credentials.uri}
  zipkin:
    discovery-client-enabled: true
  sleuth:
    sampler:
      probability: 1.0
eureka:
  instance:
    hostname: ${vcap.application.uris[0]}
    non-secure-port: 80
  client:
    service-url:
      defaultZone: ${vcap.services.discovery.credentials.uri}
server:
  port: ${PORT:8080}

config:
  cfsQuery: bos-catalog.cf.nd-pass.itn.ftgroup/serviceCatalogManagement/v1/serviceSpecification

---
spring:
  config:
    activate:
      on-profile: ibm-cf
  cloud:
    stream:
      kafka.binder:
        brokers: ${vcap.services.kafka.credentials.kafka_brokers_sasl}
        configuration:
          security:
            protocol: SASL_SSL
          sasl:
            mechanism: PLAIN
        jaas:
          loginModule: org.apache.kafka.common.security.plain.PlainLoginModule
          options:
            username: "${vcap.services.kafka.credentials.user}"
            password: "${vcap.services.kafka.credentials.password}"
        replication-factor: 3
  zipkin:
    discoveryClientEnabled: false
  sleuth:
    enabled: true
    sampler:
      probability: 0.0

