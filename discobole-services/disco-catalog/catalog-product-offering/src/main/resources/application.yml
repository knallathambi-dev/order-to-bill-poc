spring:
  cloud:
    function:
      definition: handle;productOfferingCategory;policyNotification
    discovery:
      enabled: false
    service-registry:
      auto-registration:
        enabled: false
    stream:
      kafka.binder:
        brokers: localhost
        defaultBrokerPort: 9092
        auto-add-partitions: true
        auto-create-topics: true
      default:
        contentType: application/json
      bindings:
        category-out-0:
          contentType: application/json
          destination: catalog.category
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
        productOffering-out-0:
          contentType: application/json
          destination: catalog.product-offering
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
        categoryProductOffering-out-0:
          contentType: application/json
          destination: category.categoryProductOffering
          producer:
            partition-key-expression: headers['partitionKey']
            partition-count: 4
            replication-factor: 1
        productOfferingCategory-in-0:
          contentType: application/json
          group: productOfferingCategory
          destination: product-offering.productOfferingCategory
        policyNotification-in-0:
          contentType: application/json
          group: catalog
          destination: policy-notification
        handle-out-0:
          contentType: application/json
          group: envelope
          destination: envelope
      default-binder: kafka
  zipkin:
    discoveryClientEnabled: false
  sleuth:
    enabled: true
    sampler:
      probability: 0.0
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  main:
    allow-bean-definition-overriding: true

  data:
    mongodb:
      host: localhost
      port: 27017
      database: catalog
      username: root
      password: root
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web.exposure.include: health, metrics, prometheus
  metrics:
    tags:
      application: discobole-productcatalog-product-offering
    distribution:
      percentiles-histogram:
        http.server.requests: true
  server:
    port: 9000
resilience4j.retry:
  instances:
    configuratorRetry:
      max-attempts: 3
      wait-duration: 500ms
      retry-exceptions:
        # This is the one thrown by your custom error handler for 5xx errors.
        - com.orange.discobole.productcatalog.productoffering.exception.DiscoClientException
        # This is for network-level errors (e.g., connection refused, host not found).
        - org.springframework.web.client.ResourceAccessException
retry:
  maxAttempts: '3'
  maxDelay: '1000'


app:
  version: @project.version@
  name: @project.name@
  description: @project.description@
  ownerName: Herve Bouvier
  ownerMail: herve.bouvier@orange.com

process-flow:
  role:
    admin: disco-admin

cqrs:
