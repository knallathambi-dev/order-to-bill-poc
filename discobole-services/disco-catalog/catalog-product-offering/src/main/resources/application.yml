          source: INNERREGION
          target: validate
          guard:
          kind: EXTERNAL
        - event: validated
          source: validate
          target: validated
          actions:
            - endRegionFlow
          guard:
          kind: EXTERNAL
        - event:
          source: INNERREGION
          target: JOIN
          actions:
          guard:
          kind:
        - event:
          source: JOIN
          target: endFlow
          actions:
          guard:
          kind: EXTERNAL
        - event:
          source: OUTERREGION
          target: OUTERJOIN
          actions:
          guard:
          kind:
        - event:
          source: OUTERJOIN
          target: outerEndFlow
          actions:
          guard:
          kind: EXTERNAL

