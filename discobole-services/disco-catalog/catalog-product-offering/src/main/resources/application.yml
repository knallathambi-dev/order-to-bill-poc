  query-enabled: false
  queryBaseUrl: http://localhost:8087

config:
  cfsQuery: http://localhost:8087/serviceCatalogManagement/v1/serviceSpecification
  productSpecQuery: http://localhost:8087/productCatalogManagement/v1/productSpecification
  marketUrl: https://catalog-product-catalog-administration-integration-disco.apps.prd1.c1.paas.tech.orange/productCatalogAdministration/v5/marketSegment
  channelUrl: https://catalog-product-catalog-administration-integration-disco.apps.prd1.c1.paas.tech.orange/productCatalogAdministration/v5/channel
  productOfferingUrl: http://localhost:8087/productCatalogManagement/v1/productOffering
  productOfferingPriceUrl: http://localhost:8087/productCatalogManagement/v1/productOfferingPrice
  stockItemTypeUrl: http://localhost:8087/serviceCatalogManagement/v1/stockItemType
  stockItemUrl: http://localhost:8087/serviceCatalogManagement/v1/stockItem
  categoryUrl: http://localhost:8087/productCatalogManagement/v1/category
  categoryEntityUrl: http://localhost:8087/productCatalogManagement/v1/categoryEntity
  cpibProductUrl: http://localhost:8080/productInventoryManagement/v1/product
  adminCPIBConfigUrl: http://localhost:8080/cpibConfiguration
  productCatalogAdministrationUrl: https://catalog-product-catalog-administration-integration-disco.apps.prd1.c1.paas.tech.orange
CPIB:
  limit: 100
  offset: 0
  #expression: 0 50 21 * * ?
  event-type:
    - ServiceSpecificationStateChange
    - ServiceSpecificationAttributeValueChange
    - StockItemStateChange
    - StockItemAttributeValueChange
cron:
  productSpecExpression: 0 21 17 * * ?
  productOfferingExpression: 0 4 14 * * ?
  productOfferingPriceExpression: 0 17 13 * * ?
  jobInterval: 12
  intervalUnit: HOURS
  job-enabled: true
eventstore:
  host: localhost
  port: 1113
  username: admin
  password: changeit

