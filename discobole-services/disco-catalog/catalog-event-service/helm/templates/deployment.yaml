apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "catalog.fullname" . }}
  labels:
    {{- include "catalog.labels" . | nindent 4 }}
    {{- include "catalog.shutdownLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "catalog.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "catalog.selectorLabels" . | nindent 8 }}
        {{- include "catalog.monitoringLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "catalog.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: SPRING_PROFILES_ACTIVE
            value: openshift{{- if .Values.fluentd.enabled }},fluentd{{- end }},jsonconsole
          - name: JDK_JAVA_OPTIONS
            value: -Xlog:gc=debug:file=/tmp/gc.event-service.log:time,uptime,level,tags:filecount=5,filesize=100m -XX:+UseG1GC -Xmx512m -XX:+CrashOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump-event-service.log
          - name: KAFKA
            value: {{ .Values.services.kafka | default "kafka:9092" }}
          - name: KEYCLOAK_SERVICE
            value: {{ .Values.services.keycloak | default "keycloak:80" }}
          - name: KEYCLOAK_REALM
            value: {{ .Values.services.keycloakrealm | default "SpringBootKeycloak" }}
          - name: KEYCLOAK_ROUTE
            value: {{ .Values.services.keycloakroute | default "keycloak" }}
          - name: USERROLE-RETRIEVE-SERVICE-NAME
            value: {{ .Values.services.userroleretrieve | default "auth-userrole-retrieve:8080" }}
          - name: KEYCLOAK_ISSUER_URI
            value: {{ .Values.keycloak.issuerURI | default "https://keycloak-disco.apps.prd1.c1.paas.tech.orange/realms/SpringBootKeycloak" }}

          {{- if .Values.fluentd.enabled }}
          - name: FLUENTD_TAG
            value: "{{ default "event-service" .Values.fluentd.tag }}"
          - name: FLUENTD_HOST
            value: "{{ default "localhost" .Values.fluentd.host }}"
          - name: FLUENTD_PORT
            value: "{{ default "24224" .Values.fluentd.port }}"
          {{- end }}

          {{- if .Values.otel.enabled }}
          - name: JAVA_TOOL_OPTIONS
            value: "-javaagent:/app/opentelemetry-javaagent.jar"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://{{ .Values.otel.sidecar.otlp.host }}:{{ .Values.otel.sidecar.otlp.port }}"
          - name: OTEL_METRICS_EXPORTER
            value: "none"
          - name: OTEL_TRACES_EXPORTER
            value: "otlp"
          - name: OTEL_SERVICE_NAME
            value: "{{ template "catalog.fullname" . }}"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "service.name={{ include "catalog.fullname" . }},app=event-service,deployment.environment={{ default "undefined" .Values.monitoring.environment }},cloud.platform={{ default "undefined" .Values.otel.attributes.platform }},cloud.region={{ default "undefined" .Values.otel.attributes.region }},host.name={{ default "undefined" .Values.otel.attributes.hostname }},k8s.cluster.name={{ default "undefined" .Values.otel.attributes.cluster }},k8s.namespace.name={{ default "undefined" .Values.otel.attributes.namespace }},container_name=event-service"
          {{- end }}

          ports:
            - name: http
              containerPort: 8080 
              protocol: TCP
            - name: actuator
              containerPort: 9000
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /app/application.yaml
              subPath: application.yaml
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
      - name: config-volume  ## name of the ConfigMap to mount as volume
        configMap:
          name: {{ include "catalog.fullname" . }}-appconfig
          defaultMode: 420