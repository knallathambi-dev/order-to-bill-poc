openapi: "3.0.0"
info:
  description: "The productCatalogAdministration API provides for management which\
    \ includes CRUD operations for entities that are referred in product catalog like\
    \ catalog constants. These may be currencies, units of measures, frequencyTypes\
    \ etc. The API is not a TMF prescribed API and supports the following operations:\n\
    1.POST\n2.PATCH\n3.PUT\n4.DELETE"
  version: "5.7.0_inProgress"
  title: "ProductCatalogAdministration"
tags:
  - name: "CpibConfiguration"
    description: "Identifies if product inventory is to be checked before change in\
    \ lifecycle"
  - name: "Currency"
    description: "Identifies the currency format"
  - name: "ProductCatalogAdministration"
    description: "Main resource for administration of the product catalog"
  - name: "FrequencyTypes"
    description: "Identifies the types of ffrequencies defined in the product catalog\
    \ entities"
  - name: "Unit"
    description: "Identifies the units of measure configured in the product catalog"
  - name: "Channel"
    description: "Channels supported by the front ends."
  - name: "Version"
    description: "Identifies the version of the API"
  - name: "Status"
    description: "Identifies the health of the API"
  - name: "MarketSegment"
    description: "Supported market segment"
  - name: "CFSRelationshipRestriction"
    description: "Enables/disables the relationship restriction from CFS level to PS."
  - name: "TaxItem"
    description: "taxItem is used to define tax rates and amounts."
