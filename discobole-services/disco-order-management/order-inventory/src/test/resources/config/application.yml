spring:
  data:
    mongodb:
      host: localhost
      port: 27017
      username: ${TEST_MONGO_USERNAME}
      password: ${TEST_MONGO_PASSWORD}
      database: ${TEST_MONGODB_DATABASE}
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/SpringBootKeycloak
            user-name-attribute: preferred_username
      resourceServer:
        jwt:
          issuer-uri: http://localhost:8080/realms/SpringBootKeycloak

app:
  security:
    userRoleRetrievalUrl: http://localhost:8089/userRolePermission/v1/userRole
    resourceAccessRolesClient: gateway
    discoAdminRole: disco-admin