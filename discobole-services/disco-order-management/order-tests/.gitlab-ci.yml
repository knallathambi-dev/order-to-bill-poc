# ==================================================
# Include pipeline templates
# ==================================================

include:
  # Gitleaks template
  - remote: 'https://gitlab.com/to-be-continuous/gitleaks/-/raw/2.6.0/templates/gitlab-ci-gitleaks.yml'
    # semantic-release template
  - remote: 'https://gitlab.com/to-be-continuous/semantic-release/-/raw/3.11.3/templates/gitlab-ci-semrel.yml'

# ==================================================
# Pipeline variables
# ==================================================

# secret variables
# (define the variables below in your GitLab group/project variables)
# GITLAB_TOKEN: A GitLab 'project access token' or 'personal access token' with `api`, `read_repository` and `write repository` scopes.
# SEMREL_GPG_SIGNKEY: Path to the GPG signkey exported with `gpg --armor --export-secret-key`.

variables:
  # Gitleaks template parameters
  GITLEAKS_IMAGE: "registry.hub.docker.com/zricethezav/gitleaks:v8.15.0"

  TEST_PLAN_KEY:
    value: ""
    description: "JIRA key of the XRAY test plan to update. For example: TEST-0000 (must already exist in Jira)"

  TEST_EXECUTION_KEY:
    value: ""
    description: "JIRA key for the XRAY test execution to be updated. For example: TEST-1111 (must already exist in Jira)."
  VERSION:
    value: ""
    description: "Fix version to be included in the test execution with the XRAY connector (the version must already exist in Jira)."
  ENVIRONNEMENT:
    value: "Integration"
    description: "The name of the environment to be reported in the test execution with the XRAY connector."

# ==================================================
# Pipeline stages
# ==================================================

stages:
  - test
  - om-accessories
  - om-package-basic
  - om-package-comfort
  - om-package-max
  - om-package-max-plus
  - om-package-relax
  - om-package-smart-contract
  - om-package-smart-contract-internet
  - om-package-convergent-extra
  - om-package-mobile-extra-convergent
  - om-package-mobile-ftth-essential
  - om-package-mobile-ftth-premium
  - om-migration
  - update-xray
  - publish

# ==================================================
# Pipeline jobs
# ==================================================

.before_script: &before_script
  - export KC_USERNAME_ID=$KC_USERNAME
  - export KC_PASSWORD_ID=$KC_PASSWORD
  - export KC_CLIENT_ID=$KC_CLIENT
  - |
    if [ "$CI_COMMIT_BRANCH" != "main" ]; then
      export KC_CLIENT_SECRET=$KC_CLIENTSECRET
      export KEYCLOAK_URL_VAR=$KEYCLOAK_VAR
      export ENDPOINT_POI=$POI
      export ENDPOINT_CONFIG=$CONFIG_URL
      export ENDPOINT_OM_OC=$OM_END_POINT
      export ENDPOINT_PI=$PI
      export ENDPOINT_CATALOG=$CATALOG_URL
      export ENDPOINT_SETTING=$SETTING_URL
    else
      export KC_CLIENT_SECRET=$KC_CLIENTSECRET_STAGING
      export KEYCLOAK_URL_VAR=$KEYCLOAK_VAR_STAGING
      export ENDPOINT_POI=$POI_STAGING
      export ENDPOINT_CONFIG=$CONFIG_URL_STAGING
      export ENDPOINT_OM_OC=$OM_END_POINT_STAGING
      export ENDPOINT_PI=$PI_STAGING
      export ENDPOINT_CATALOG=$CATALOG_URL_STAGING
      export ENDPOINT_SETTING=$SETTING_URL_STAGING
    fi

.artifacts_common: &artifacts_common
  when: always
  expire_in: 72h
  paths:
    - result/

package-samsung-buds:
  stage: om-accessories
  image: ppodgorsek/robot-framework:latest
  before_script: *before_script
  script:
    - TIMESTAMP=$(date +"%Y_%m_%d_%H_%M_%S")
    - robot --include Test_Suite_Samsung_Buds_Aquisition -l result/log_Samsung_Buds_$TIMESTAMP.html -r result/Samsung_Buds_$TIMESTAMP.html -o result/Samsung_Buds_$TIMESTAMP.xml BDD_Nominal_case_Accessories/Aquisition_Samsung_Buds.robot
  artifacts: *artifacts_common
  allow_failure: true
  timeout: 2h

