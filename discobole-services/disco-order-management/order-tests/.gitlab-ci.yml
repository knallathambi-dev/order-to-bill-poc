    - robot --include Test_Suite_Samsung_Case_Aquisition -l result/log_Samsung_case_$TIMESTAMP.html -r result/Samsung_case_$TIMESTAMP.html -o result/Samsung_case_$TIMESTAMP.xml BDD_Nominal_case_Accessories/Aquisition_Samsung_case.robot
