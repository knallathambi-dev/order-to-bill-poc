  image: ppodgorsek/robot-framework:latest
  before_script: *before_script
  script:
    - TIMESTAMP=$(date +"%Y_%m_%d_%H_%M_%S")
    - robot --include Test_Suite_Migration_Aquisition -l result/log_migration_$TIMESTAMP.html -r result/migration_$TIMESTAMP.html -o result/migration_$TIMESTAMP.xml BDD_Nominal_case_Migration/Acquisation_Migration_use_case.robot
  artifacts: *artifacts_common
  allow_failure: true
  timeout: 2h
  after_script:
    - rebot --output ./result/output.xml ./result/*.xml

reuse:
  image:
    name: fsfe/reuse:latest
    entrypoint: []
  stage: .pre
  script:
    - reuse lint
    - if [ 0 != 0 ]; then log_error Fix the error with reuse annotate --copyright=\"Orange SA\" --template mit.jinja --license MIT --copyright-prefix spdx --skip-unrecognised --merge-copyrights --recursive ./; fi

update-xray:
  stage: update-xray
  image: curlimages/curl:latest
  dependencies:
    - package-samsung-buds
    - package-samsung-case
    - package-vr-headset
    - package-basic-acquisition
    - package-comfort-acquisition-modification
    - package-comfort-acquisition
    - package-max-acquisition
    - package-max-acquisition-modification
    - package-max-Plus-acquisition
    - package-max-Plus-acquisition-modification
    - package-relax-aquisition
    - package-relax-aquisition-modification
    - package-smart-contract-aquisition
    - package-smart-contract-internet-aquisition
    - package-convergent-extra
    - Migration-use-case
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - 'curl --insecure  -H "Content-Type: multipart/form-data" -H "Authorization: Bearer ${JIRA_TOKEN}"  -F "file=@result/output.xml"  "https://portail.agir.orange.com/rest/raven/1.0/import/execution/robot?projectKey=${PROJECT_KEY}&testPlanKey=${TEST_PLAN_KEY}"' # gitleaks:allow
  allow_failure: true