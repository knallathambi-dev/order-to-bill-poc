include:
  - project: 'discobole/discobole-to-be-continuous/service'
    ref: 'main'
    file: '/templates/gitlab-ci-service.yml'

 
# ==================================================
# Pipeline Stages
# ==================================================
stages:
  - debug
  - build
  - test
  - package-build
  - package-test
  - infra
  - deploy
  - acceptance
  - publish
  - infra-prod
  - production


