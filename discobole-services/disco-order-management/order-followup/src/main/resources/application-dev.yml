spring:
  config:
    activate:
      on-profile: dev
  profiles:
    group:
      dev:
        - default

logging:
  level:
    root: INFO
    com.orange.discobole.ordermanagement.orderfollowup: DEBUG

app:
  security:
    ssl:
      enabled: false

cron:
  expression: 0/10 * * * * *