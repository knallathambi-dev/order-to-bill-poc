openapi: 3.0.0
info:
  title: ProductOrderingManagement
  version: 2.9.6_release
  description: The Product Ordering API TMF622 is a standarized interface that standardizes
    the retrieval of information from order inventory. It enables consistent interaction
    between consumers fetching the order inventory or details and  the  inventory
    storing order information such as order date, order price, order item, ordered
    offer ...
tags:
  - name: ProductOrder
  - name: Status
  - name: Version
  - name: Doc
servers:
  - url: https://serverRoot
components:
  schemas:
    AddressCharacteristic:
      description: An object that stores the address details provided by the customer
        for a service. It helps keep track of the address information related to each
        product or service.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            addressId:
              type: string
              description: A unique identifier for the specific address. This helps
                in referencing and managing addresses within the system.
            city:
              type: string
              description: The name of the city where the address is located.
            country:
              type: string
              description: The name of the country for the address.
            subUnitNumber:
              type: string
              description: The specific unit or suite number within a larger building
                or complex, such as an apartment, office or retail unit.
            streetName:
              type: string
              description: The name of the street where the address is located.
            postcode:
              type: string
              description: The postal code or ZIP code used to identify a specific geographic
                area for mail delivery.
    AppointmentRef:
      description: Refers an appointment, such as a customer presentation or internal
        meeting or site visit.
      type: object
      properties:
        id:
          type: string
          description: The identifier of the referred appointment.
        href:
          type: string
          description: The reference of the appointment.
        description:
          type: string
          description: An explanatory text regarding the appointment made with a party.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
        - id
        - '@type'
    BillingAccountRef:
      description: BillingAccount reference. A BillingAccount is a detailed description
        of a bill structure.
      type: object
      properties:
        id:
          type: string
          description: The identifier of the referred entity.
        href:
          type: string
          description: The URI of the referred entity.
        name:
          type: string
          description: Name of the referred entity.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
        ratingType:
          type: string
          description: Indicates whether the account follows a specific payment option
            such as prepaid or postpaid.
      required:
        - id
        - '@type'
    BooleanArrayCharacteristic:
      description: Represents a characteristic containing multiple true/false values
        in an ordered collection, used to describe sets of binary conditions or feature
        toggles.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: array
              items:
                type: boolean
              description: Value of the characteristic.
    BooleanCharacteristic:
      description: Represents a characteristic with a true/false value, used to describe
        binary states or conditions of an object or entity.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: boolean
              description: Value of the characteristic.
    ChannelRef:
      description: The channel to which the resource reference to. e.g. channel for
        selling product offerings, channel for opening a trouble ticket etc..
      type: object
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        href:
          type: string
          description: The URI of the referred entity.
        id:
          type: string
          description: The identifier of the referred entity.
        name:
          type: string
          description: Name of the referred entity.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
        - '@type'
        - id
    Characteristic:
      description: Describes a given characteristic of an object or entity through
        a name/value pair.
      type: object
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        id:
          type: string
          description: Unique identifier of the characteristic.
        name:
          type: string
          description: Name of the characteristic.
        valueType:
          type: string
          description: Data type of the value of the characteristic.
      required:
        - '@type'
      discriminator:
        propertyName: '@type'
        mapping:
          BooleanCharacteristic: '#/components/schemas/BooleanCharacteristic'
          IntegerCharacteristic: '#/components/schemas/IntegerCharacteristic'
          StringCharacteristic: '#/components/schemas/StringCharacteristic'
          FloatCharacteristic: '#/components/schemas/FloatCharacteristic'
          ObjectCharacteristic: '#/components/schemas/ObjectCharacteristic'
          IntegerArrayCharacteristic: '#/components/schemas/IntegerArrayCharacteristic'
          StringArrayCharacteristic: '#/components/schemas/StringArrayCharacteristic'
          FloatArrayCharacteristic: '#/components/schemas/FloatArrayCharacteristic'
          ObjectArrayCharacteristic: '#/components/schemas/ObjectArrayCharacteristic'
          BooleanArrayCharacteristic: '#/components/schemas/BooleanArrayCharacteristic'
          ValidityCharacteristic: '#/components/schemas/ValidityCharacteristic'
          AddressCharacteristic: '#/components/schemas/AddressCharacteristic'
          DateCharacteristic: '#/components/schemas/DateCharacteristic'
    Component:
      description: Represents the status and metadata of a service dependency, including
        its name, version, and operational state (e.g., "ok" or "ko").
      type: object
      properties:
        name:
          type: string
          description: Your service internal name.
        status:
          $ref: '#/components/schemas/StatusEnum'
        version:
          type: string
          description: Your component version (major dot minor dot patch numbers).
      required:
        - name
        - status
        - version
    Duration:
      description: A time interval in a given unit of time.
      type: object
      properties:
        amount:
          type: integer
          format: int32
          description: Time interval (number of seconds, minutes, hours, etc...)
        units:
          type: string
          description: Unit of time (seconds, minutes, hours, etc...)
    Error:
      description: Represents an Error.
      type: object
      properties:
        code:
          type: string
          description: Application relevant detail, defined in the API or a common
            list.
        message:
          type: string
          description: More details and corrective actions related to the error which
            can be shown to a client user.
        reason:
          type: string
          description: Explanation of the reason for the error which can be shown
            to a client user.
        referenceError:
          type: string
          format: uri
          description: URI of documentation describing the error.
        status:
          type: string
          description: HTTP Error code extension.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - code
        - reason
    FloatArrayCharacteristic:
      description: Represents a characteristic containing multiple decimal numeric
        values in an ordered collection, used to describe series of measurements,
        coordinates, or sets of fractional data.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: array
              items:
                type: number
                format: float
              description: Value of the characteristic.
    FloatCharacteristic:
      description: Represents a characteristic with a decimal numeric value, used
        to describe measurements, rates, or quantities requiring fractional precision.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: number
              format: float
              description: Value of the characteristic.
    IntegerArrayCharacteristic:
      description: Represents a characteristic containing multiple whole number values
        in an ordered collection, used to describe sets of countable quantities or
        sequences of discrete values.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: array
              items:
                type: integer
                format: int32
              description: Value of the characteristic.
    IntegerCharacteristic:
      description: Represents a characteristic with a whole number value, used to
        describe countable quantities, discrete measurements, or numeric identifiers.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: integer
              format: int32
              description: Value of the characteristic.
    Money:
      description: A base / value business entity used to represent money.
      type: object
      properties:
        unit:
          type: string
          description: Currency (ISO4217 norm uses 3 letters to define the currency)
        value:
          type: number
          format: float
          description: A signed floating point number, the meaning of the sign is
            according to the context of the API that uses this Data type.
    ObjectArrayCharacteristic:
      description: Represents a characteristic containing multiple complex structured
        values in an ordered collection, used to describe repeating composite attributes
        with consistent internal structure.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: array
              items:
                type: object
              description: Value of the characteristic.
    ObjectCharacteristic:
      description: Represents a characteristic with a complex structured value containing
        nested properties, used to describe composite attributes that require multiple
        interrelated fields.
      allOf:
        - $ref: '#/components/schemas/Characteristic'
        - type: object
          properties:
            value:
              type: object
              description: Value of the characteristic.
    OrderItemRelationship:
      description: Used to describe relationship between Order item. These relationship
        could have an impact on pricing and conditions.
      type: object
      properties:
        id:
          type: string
          description: Id of the related Order item (must be in the same Order).
        relationshipType:
          $ref: '#/components/schemas/RelationshipType'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
    OrderPrice:
      description: An amount, usually of money, that represents the actual price paid
        by the customer for this item or this order.
      type: object
      properties:
        description:
          type: string
          description: A narrative that explains in detail the semantics of this order
            item price.
        name:
          type: string
          description: A short descriptive name such as "Subscription price".
        priceType:
          type: string
          description: Indicate if the price is for recurrent or no-recurrent charge.
        recurringChargePeriod:
          $ref: '#/components/schemas/Quantity'
        unitOfMeasure:
          type: string
          description: Could be minutes, GB...
        billingAccount:
          $ref: '#/components/schemas/BillingAccountRef'
        price:
          $ref: '#/components/schemas/Price'
        productOfferingPrice:
          $ref: '#/components/schemas/ProductOfferingPriceRefOrValue'
        priceAlteration:
          type: array
          items:
            $ref: '#/components/schemas/PriceAlteration'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        applicationDuration:
          $ref: '#/components/schemas/Quantity'
      required:
        - '@type'
    OrderTerm:
      description: Description of a productTerm linked to this orderItem. This represent
        a commitment with a duration.
      type: object
      properties:
        description:
          type: string
          description: Description of the productOrderTerm.
        name:
          type: string
          description: Name of the productOrderTerm.
        duration:
          $ref: '#/components/schemas/Duration'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
    PartyRef:
      description: A Party reference.
      allOf:
        - $ref: '#/components/schemas/PartyRefOrPartyRoleRef'
        - type: object
          properties:
            '@baseType':
              type: string
              description: When sub-classing, this defines the super-class.
            '@schemaLocation':
              type: string
              format: uri
              description: A URI to a JSON-Schema file that defines additional attributes
                and relationships.
            href:
              type: string
              description: The URI of the referred entity.
            id:
              type: string
              description: The identifier of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    PartyRefOrPartyRoleRef:
      description: A reference to either a Party or a PartyRole.
      type: object
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
      discriminator:
        propertyName: '@type'
        mapping:
          PartyRef: '#/components/schemas/PartyRef'
          PartyRoleRef: '#/components/schemas/PartyRoleRef'
    PartyRoleRef:
      description: Party role reference. A party role represents the part played by
        a party in a given context.
      allOf:
        - $ref: '#/components/schemas/PartyRefOrPartyRoleRef'
        - type: object
          properties:
            partyId:
              type: string
              description: The identifier of the engaged party that is linked to the
                PartyRole object.
            partyName:
              type: string
              description: The name of the engaged party that is linked to the PartyRole
                object.
            '@baseType':
              type: string
              description: When sub-classing, this defines the super-class.
            '@schemaLocation':
              type: string
              format: uri
              description: A URI to a JSON-Schema file that defines additional attributes
                and relationships.
            href:
              type: string
              description: The URI of the referred entity.
            id:
              type: string
              description: The identifier of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
          required:
            - id
    PaymentRef:
      description: If an immediate payment has been done at the product order submission,
        the payment information are captured and stored (as a reference) in the order.
      type: object
      properties:
        id:
          type: string
          description: The identifier of the referred entity.
        href:
          type: string
          description: The URI of the referred entity.
        name:
          type: string
          description: Name of the referred entity.
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
        '@referredType':
          type: string
          description: The actual type of the target instance when needed for disambiguation.
      required:
        - id
        - '@type'
    Price:
      description: Provides all amounts (tax included, duty free, tax rate), used
        currency and percentage to apply for Price and Price Alteration.
      type: object
      properties:
        percentage:
          type: number
          format: float
          description: Percentage to apply for ProdOfferPriceAlteration.
        taxRate:
          type: number
          format: float
          description: Tax rate.
        dutyFreeAmount:
          $ref: '#/components/schemas/Money'
        taxIncludedAmount:
          $ref: '#/components/schemas/Money'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
    PriceAlteration:
      description: A structure used to describe a price alteration.
      type: object
      properties:
        description:
          type: string
          description: A narrative that explains in detail the semantics of this order
            item price alteration.
        name:
          type: string
          description: Name of the order item price alteration.
        priceType:
          type: string
          description: A category that describes the price such as recurring, one
            time and usage.
        priority:
          type: integer
          format: int32
          description: Priority level for applying this alteration among all the defined
            alterations on the order item price.
        applicationDuration:
          $ref: '#/components/schemas/Quantity'
        applicationOffset:
          type: integer
        recurringChargePeriod:
          $ref: '#/components/schemas/Quantity'
        unitOfMeasure:
          type: string
          description: Could be minutes, GB...
        price:
          $ref: '#/components/schemas/Price'
        productOfferingPrice:
          $ref: '#/components/schemas/ProductOfferingPriceRefOrValue'
        '@baseType':
          type: string
          description: When sub-classing, this defines the super-class.
        '@schemaLocation':
          type: string
          format: uri
          description: A URI to a JSON-Schema file that defines additional attributes
            and relationships.
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
    Product:
      description: A product offering procured by a customer or other interested party
        playing a party role. A product is realized as one or more service(s) and
        / or resource(s).
      allOf:
        - $ref: '#/components/schemas/ProductRefOrValue'
        - type: object
          properties:
            id:
              type: string
              description: unique identifier.
            '@baseType':
              type: string
              description: When sub-classing, this defines the super-class.
            href:
              type: string
              description: Hyperlink reference.
            description:
              type: string
              description: Is the description of the product. It could be copied from
                the description of the Product Offering.
            isBundle:
              type: boolean
              description: If true, the product is a ProductBundle which is an instantiation
                of a BundledProductOffering. If false, the product is a ProductComponent
                which is an instantiation of a SimpleProductOffering.
            isCustomerVisible:
              type: boolean
              description: If true, the product is visible by the customer.
            name:
              type: string
              description: Name of the product. It could be the same as the name of
                the product offering.
            orderDate:
              type: string
              format: date-time
              description: Is the date when the product was ordered.
            productSerialNumber:
              type: string
              description: Is the serial number for the product. This is typically applicable
                to tangible products e.g. Broadband Router.
            startDate:
              type: string
              format: date-time
              description: Is the date from which the product starts.
            terminationDate:
              type: string
              format: date-time
              description: Is the date when the product was terminated.
            product:
              type: array
              items:
                $ref: '#/components/schemas/ProductRefOrValue'
            productCharacteristic:
              type: array
              items:
                $ref: '#/components/schemas/Characteristic'
            productOffering:
              $ref: '#/components/schemas/ProductOfferingRef'
            productRelationship:
              type: array
              items:
                $ref: '#/components/schemas/ProductRelationship'
            productSpecification:
              $ref: '#/components/schemas/ProductSpecificationRef'
            productTerm:
              type: array
              items:
                $ref: '#/components/schemas/ProductTerm'
            realizingResource:
              type: array
              items:
                $ref: '#/components/schemas/ResourceRef'
            realizingService:
              type: array
              items:
                $ref: '#/components/schemas/ServiceRef'
            status:
              $ref: '#/components/schemas/ProductStatusType'
            '@schemaLocation':
              type: string
              format: uri
              description: A URI to a JSON-Schema file that defines additional attributes
                and relationships.
            billingAccount:
              $ref: '#/components/schemas/BillingAccountRef'
            creationDate:
              type: string
              format: date-time
              description: Date and time when the product was created.
    ProductOfferingPriceRefOrValue:
      description: ProductPriceOffering reference. An amount, usually of money, that
        is asked for or allowed when a ProductOffering is bought, rented or leased.
      type: object
      properties:
        '@type':
          type: string
          description: When sub-classing, this defines the sub-class Extensible name.
      required:
        - '@type'
      discriminator:
        propertyName: '@type'
        mapping:
          InstallmentCharge: '#/components/schemas/InstallmentCharge'
          ProductOfferingPriceCharge: '#/components/schemas/ProductOfferingPriceCharge'
          ProductOfferingPriceRef: '#/components/schemas/ProductOfferingPriceRef'
    ProductOfferingPriceRef:
      allOf:
        - type: object
          properties:
            id:
              type: string
            href:
              type: string
            name:
              type: string
            '@baseType':
              type: string
            '@schemaLocation':
              type: string
              format: uri
              description: A URI to a JSON-Schema file that defines additional attributes
                and relationships.
            '@referredType':
              type: string
          required:
            - id
        - $ref: '#/components/schemas/ProductOfferingPriceRefOrValue'
    RelatedContactMedium:
      description: "Related contact of the customer."
      type: object
      properties:
        id:
          type: string
        contactType:
          type: string
        role:
          type: string
        preferred:
          type: boolean
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        '@baseType':
          type: string
        '@schemaLocation':
          type: string
        '@type':
          type: string
      required:
        - '@type'
      discriminator:
        propertyName: '@type'
        mapping:
          EmailContactMedium: '#/components/schemas/EmailContactMedium'
          PhoneContactMedium: '#/components/schemas/PhoneContactMedium'
    EmailContactMedium:
      description: "Related contact of the customer with email information."
      allOf:
        - type: object
          properties:
            emailAddress:
              type: string
        - $ref: '#/components/schemas/RelatedContactMedium'
    PhoneContactMedium:
      description: "Related contact of the customer with phone contact information."
      allOf:
        - type: object
          properties:
            mobilePhone:
              type: string
        - $ref: '#/components/schemas/RelatedContactMedium'
    QueryProductConfigurationRef:
      description: Refers a product configuration.
      type: object
      properties:
        queryProductConfigurationItemId:
          type: string
        queryProductConfigurationId:
          type: string
        queryProductConfigurationHref:
          type: string
        '@type':
          type: string
      required:
        - '@type'
    InstallmentCharge:
      description: A reference to a Product Offering Price entity.
      allOf:
        - $ref: '#/components/schemas/ProductOfferingPriceRefOrValue'
        - type: object
          properties:
            interestRate:
              type: number
              format: float
            downPayment:
              type: number
              format: float
            partner:
              type: string
            externalId:
              type: string
            id:
              type: string
              description: The identifier of the referred entity.
            href:
              type: string
              description: The URI of the referred entity.
            name:
              type: string
              description: Name of the referred entity.
            '@baseType':
              type: string
              description: When sub-classing, this defines the super-class.
            '@schemaLocation':
              type: string
              format: uri
              description: A URI to a JSON-Schema file that defines additional attributes
                and relationships.
            '@referredType':
              type: string
              description: The actual type of the target instance when needed for disambiguation.
            immediatePayment:
              type: boolean
              description: Used to specify whether a payment should be processed instantly
                ("true") or if it allows for a delay ("false")
            version:
              type: string
              description: ProductOfferingPrice version.
            price:
              $ref: '#/components/schemas/Money'
            recurringChargePeriodLength:
              type: integer
              format: int32
              description: "The period of the recurring charge: 1, 2, \u2026 .It sets\
                \ to zero if it is not applicable."
            recurringChargePeriodType:
              type: string
              description: "The period to repeat the application of the price. Could be\
                \ month, week\u2026"
            applicationDuration:
              $ref: '#/components/schemas/Quantity'
            isBundle:
              type: boolean
              description: A flag indicating if this ProductOfferingPrice is composite
                (bundle) or not.
            lastUpdate:
              type: string
              format: date-time
