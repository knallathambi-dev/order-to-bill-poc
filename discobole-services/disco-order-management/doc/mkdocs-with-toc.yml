## --- MkDocs configuration (https://www.mkdocs.org/user-guide/configuration/)

site_name: DISCOBOLE - Order Management
site_url: !ENV [SITE_URL, CI_PAGES_URL, 'https://discobole.ow2.io/disco-oda-components/disco-order-management/doc/']
site_author: DISCOBOLE Team
repo_url: !ENV [REPO_URL, CI_PROJECT_URL, 'https://gitlab.ow2.org/discobole/disco-oda-components/disco-order-management']
site_dir: public
# edit_uri: https://discobole.ow2.io/edit/main/docs/

extra:
  generator: false

plugins:
  - git-revision-date
  - search
  - plantuml: # visit https://medium.com/@michkravets/add-inline-plantuml-to-your-mkdocs-documentation-9a2acb7599a6
      puml_url: https://www.plantuml.com/plantuml/
      num_workers: 8
  - swagger-ui-tag # visit https://github.com/blueswen/mkdocs-swagger-ui-tag

markdown_extensions:
  - toc:
      toc_depth: 3
      permalink: True
  - mdx_truly_sane_lists
  - md_in_html
  - meta
  - codehilite
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.superfences

  # enable extended formatting (https://squidfunk.github.io/mkdocs-material/reference/formatting/)
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde

## --- Material theme for MkDocs configuration (https://squidfunk.github.io/mkdocs-material/setup/changing-the-colors/)

theme:
  name: material
  favicon: img/logo.png
  logo: img/logo.png
  font: false
  icon:
    repo: fontawesome/brands/gitlab
  palette:
    primary: "black"
    accent: "deep orange"
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.action.edit
  language: "en"

