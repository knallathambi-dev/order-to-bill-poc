{{- if .Values.registryCredentials.create -}}
kind: Secret
type: kubernetes.io/dockerconfigjson
apiVersion: v1
metadata:
  name: selfcare-ui-tech-pull-token-{{ .Values.environmentType }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "selfcareui.labels" . | nindent 4 }}
data:
  .dockerconfigjson: {{ template "selfcareui.regcredData" . }}
{{- end }}
