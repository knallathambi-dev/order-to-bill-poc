<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link href="/discobole.ico" rel="icon" type="image/x-icon"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Administration Portal</title>
    <!-- Load environment config (env.js generated by Docker in production) -->
    <script type="module">
        // In development, load from env.local.js
        // In production, env.js is generated by Docker entrypoint
        if (import.meta.env.DEV) {
            import('/env.local.js');
        }
    </script>
    <script src="/env.js"></script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
