name: order-to-bill-poc

x-discobole-service-env: &discobole-service-env
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "9000"
  SPRING_PROFILES_ACTIVE: "dev,plaintextconsole"
  SPRING_PROFILES_GROUP_DEV: "default"
  SPRING_CLOUD_KUBERNETES_ENABLED: "false"
  SPRING_CLOUD_KUBERNETES_CONFIG_ENABLED: "false"
  SPRING_CLOUD_CONFIG_ENABLED: "false"
  SPRING_DATA_MONGODB_HOST: "mongodb"
  SPRING_DATA_MONGODB_PORT: "27017"
  SPRING_DATA_MONGODB_DATABASE: "otb_poc"
  SPRING_DATA_MONGODB_USERNAME: ""
  SPRING_DATA_MONGODB_PASSWORD: ""
  SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/otb_poc?replicaSet=rs0"
  MONGODB_USERNAME: ""
  MONGODB_PASSWORD: ""
  MONGODB_DATABASE: "otb_poc"
  AWS_ACCESS_KEY_ID: "local-access-key"
  AWS_SECRET_ACCESS_KEY: "local-secret-key"
  BUCKET_HOST: "localhost"
  BUCKET_PORT: "9000"
  BUCKET_NAME: "product-bucket"
  BUCKET_REGION: "us-east-1"
  ACCESS_KEY_ID: "local-access-key"
  SECRET_ACCESS_KEY: "local-secret-key"
  LINK_EXPIRATION_MINUTES: "15"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: "kafka:9092"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: "http://keycloak:8080/realms/discobole/protocol/openid-connect/certs"
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: "http://localhost:8080/realms/discobole"
  SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/discobole"
  KEYCLOAK_URL: "http://keycloak:8080"
  KEYCLOAK_URI: "http://keycloak:8080"
  KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/discobole"
  KEYCLOAK_CLIENT_SECRET: "change-me"
  ORDER_KEYCLOAK_CLIENT_SECRET: "change-me"
  AUTH_USER_ROLE_SERVICE: "http://auth-userrole:8080"

services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7}
    profiles: ["infra"]
    command: ["mongod", "--replSet", "${MONGODB_REPLICA_SET:-rs0}", "--bind_ip_all"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  mongo-init:
    image: ${MONGODB_IMAGE:-mongo:7}
    profiles: ["infra"]
    depends_on:
      mongodb:
        condition: service_started
    volumes:
      - ./infrastructure/mongodb/init-replica-set.js:/init-replica-set.js:ro
    entrypoint: ["bash", "-lc"]
    command: ["for attempt in {1..60}; do mongosh --host mongodb:27017 --quiet /init-replica-set.js && exit 0; sleep 2; done; echo 'MongoDB replica set init failed after 60 attempts' >&2; exit 1"]
    restart: "no"

  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:4.3.0}
    profiles: ["infra"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    ports:
      # Host port 9092 maps to the dedicated host listener inside the container.
      # Containers use kafka:9092; host tools use localhost:9092.
      - "${KAFKA_BROKER_PORT:-9092}:19092"
      - "${KAFKA_CONTROLLER_PORT:-9093}:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,PLAINTEXT_HOST://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_BROKER_PORT:-9092}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: "${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}"
    healthcheck:
      test: ["CMD-SHELL", "test -x /opt/kafka/bin/kafka-topics.sh && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:v0.7.2}
    profiles: ["infra"]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "otb-poc"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:9092"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "debezium"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  kafka-connect:
    image: ${DEBEZIUM_CONNECT_IMAGE:-quay.io/debezium/connect:3.0}
    profiles: ["infra"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_started
      mongo-init:
        condition: service_completed_successfully
    ports:
      - "${KAFKA_CONNECT_PORT:-8083}:8083"
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "otb-poc-connect"
      CONFIG_STORAGE_TOPIC: "connect-configs"
      OFFSET_STORAGE_TOPIC: "connect-offsets"
      STATUS_STORAGE_TOPIC: "connect-status"
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      VALUE_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      CONNECT_REST_ADVERTISED_HOST_NAME: "kafka-connect"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak:
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.2}
    profiles: ["infra"]
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HOSTNAME_URL: "http://keycloak:8080"
    volumes:
      - ./infrastructure/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q keycloak"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 45s

  auth-userrole:
    image: ${AUTH_USERROLE_IMAGE:-otb-poc/auth-userrole}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${AUTH_USERROLE_PORT:-18085}:8080"
      - "${AUTH_USERROLE_MANAGEMENT_PORT:-19085}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "auth-userrole"
      SPRING_DATA_MONGODB_DATABASE: "userRoleManagement"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/userRoleManagement?replicaSet=rs0"
      SPRING_ADMIN_ROLE: "OTB_ADMIN"
      KEYCLOAKCLIENTID: "auth-userrole"
      KEYCLOAK_CLIENT_SECRET: "change-me"
      KEYCLOAK_AUTH_URL: "http://keycloak:8080/realms/discobole/protocol/openid-connect/token"
      SPRING_KEYCLOAKURL: "http://keycloak:8080"
      SPRING_KEYCLOAK: "http://keycloak:8080/realms/discobole/protocol/openid-connect/auth"
      SPRING_KEYCLOAKCLIENTID: "auth-userrole"
      SPRING_REALM: "discobole"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  order-capture:
    image: ${ORDER_CAPTURE_IMAGE:-otb-poc/order-capture}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${ORDER_CAPTURE_PORT:-18080}:8080"
      - "${ORDER_CAPTURE_MANAGEMENT_PORT:-19080}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "order-capture"
      SPRING_DATA_MONGODB_DATABASE: "order_capture"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/order_capture?replicaSet=rs0"
      APP_SECURITY_ROLEENTITLEMENTS: "ENT_ORDER_CREATE,ENT_ORDER_UPDATE"
      PRODUCT_CATALOG_SERVICE: "http://product-catalog:8080"
      PRODUCT_INVENTORY_SERVICE: "http://product-inventory:8080"
      ORDER_INVENTORY_SERVICE: "http://order-inventory:8080"
      PRODUCT_CONFIGURATOR_SERVICE: "http://product-catalog:8080"
      MOCK_SERVER_SERVICE: "http://product-catalog:8080"
      PROCESS_FLOW_ROLE_ADMIN: "OTB_ADMIN"
      ORDER_KEYCLOAK_CLIENT_ID: "order-capture"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  order-inventory:
    image: ${ORDER_INVENTORY_IMAGE:-otb-poc/order-inventory}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${ORDER_INVENTORY_PORT:-18081}:8080"
      - "${ORDER_INVENTORY_MANAGEMENT_PORT:-19081}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "order-inventory"
      SPRING_DATA_MONGODB_DATABASE: "order_inventory"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/order_inventory?replicaSet=rs0"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  product-catalog:
    image: ${PRODUCT_CATALOG_IMAGE:-otb-poc/catalog-product-catalog}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${PRODUCT_CATALOG_PORT:-18086}:8080"
      - "${PRODUCT_CATALOG_MANAGEMENT_PORT:-19086}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "product-catalog"
      SPRING_DATA_MONGODB_DATABASE: "catalog"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/catalog?replicaSet=rs0"
      SPRING_KEYCLOAK: "http://keycloak:8080/realms/discobole/protocol/openid-connect/certs"
      SPRING_USERROLERETRIEVALURL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
      SPRING_KEYCLOAKROLESENTITLEMENTS: "ENT_CATALOG_MANAGE"
      APP_SECURITY_DISABLED: "true"
      CQRS_COMMAND_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  product-specification:
    image: ${PRODUCT_SPECIFICATION_IMAGE:-otb-poc/catalog-product-specification}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${PRODUCT_SPECIFICATION_PORT:-18087}:8080"
      - "${PRODUCT_SPECIFICATION_MANAGEMENT_PORT:-19087}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "product-specification"
      SPRING_DATA_MONGODB_DATABASE: "catalog"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/catalog?replicaSet=rs0"
      SPRING_KEYCLOAK: "http://keycloak:8080/realms/discobole/protocol/openid-connect/certs"
      SPRING_USERROLERETRIEVALURL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
      SPRING_KEYCLOAKROLESENTITLEMENTS: "ENT_CATALOG_MANAGE"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  product-offering:
    image: ${PRODUCT_OFFERING_IMAGE:-otb-poc/catalog-product-offering}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${PRODUCT_OFFERING_PORT:-18088}:8080"
      - "${PRODUCT_OFFERING_MANAGEMENT_PORT:-19088}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "product-offering"
      SPRING_DATA_MONGODB_DATABASE: "catalog"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/catalog?replicaSet=rs0"
      SPRING_KEYCLOAK: "http://keycloak:8080/realms/discobole/protocol/openid-connect/certs"
      SPRING_USERROLERETRIEVALURL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
      SPRING_KEYCLOAKROLESENTITLEMENTS: "ENT_CATALOG_MANAGE"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  product-inventory:
    image: ${PRODUCT_INVENTORY_IMAGE:-otb-poc/product-inventory}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${PRODUCT_INVENTORY_PORT:-18089}:8080"
      - "${PRODUCT_INVENTORY_MANAGEMENT_PORT:-19089}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_APPLICATION_NAME: "product-inventory"
      SPRING_DATA_MONGODB_DATABASE: "product_inventory"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/product_inventory?replicaSet=rs0"
      CONFIG_TEMP_PATH: "/tmp/product-inventory"
      CONFIG_TEMPPATH: "/tmp/product-inventory"
      CONFIG_WEBCLIENT_USE_SERVICE_ACCOUNT: "false"
      CONFIG_WEBCLIENT_USESERVICEACCOUNT: "false"
      SPRING_AUTOCONFIGURE_EXCLUDE: "org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration,org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration,org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestration-delivery:
    image: ${ORCHESTRATION_DELIVERY_IMAGE:-otb-poc/orchestration-delivery}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
      product-catalog:
        condition: service_healthy
      product-inventory:
        condition: service_healthy
    ports:
      - "${ORCHESTRATION_DELIVERY_PORT:-18082}:8080"
      - "${ORCHESTRATION_DELIVERY_MANAGEMENT_PORT:-19082}:9000"
    environment:
      <<: *discobole-service-env
      PORT: "8080"
      SPRING_APPLICATION_NAME: "orchestration-delivery"
      SPRING_PROFILES_ACTIVE: "dev,plaintextconsole,no-security"
      SPRING_DATA_MONGODB_DATABASE: "orchestration_delivery"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/orchestration_delivery?replicaSet=rs0"
      KEYCLOAK_CLIENT_ID: "orchestration-delivery"
      APP_SECURITY_USER_ROLE_RETRIEVAL_URL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
      APP_SECURITY_USERROLERETRIEVALURL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
      APP_SECURITY_KEYCLOAKENTITLEMENTS: "ENT_ORCHESTRATION_READ,ENT_ORCHESTRATION_RETRY"
      CONFIG_PRODUCT_SPEC_BY_ID_CATALOG_URL: "http://product-catalog:8080/productCatalogManagement/v1/productSpecification"
      CONFIG_PRODUCT_MANAGEMENT_URL: "http://product-inventory:8080/productInventoryManagement/v1/product"
      CONFIG_PRODUCT_ORDER_BY_ID_URL: "http://order-inventory:8080/api/productOrderingManagement/v1/productOrder"
      CONFIG_FALLOUT_URL: "http://orchestration-delivery-fallout:8080/processManagement/v1/processFlow"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestration-delivery-management:
    image: ${DELIVERY_MANAGEMENT_IMAGE:-otb-poc/orchestration-delivery-management}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${DELIVERY_MANAGEMENT_PORT:-18083}:8080"
      - "${DELIVERY_MANAGEMENT_MANAGEMENT_PORT:-19083}:9000"
    environment:
      <<: *discobole-service-env
      PORT: "8080"
      SPRING_APPLICATION_NAME: "orchestration-delivery-management"
      SPRING_DATA_MONGODB_DATABASE: "orchestration_delivery"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/orchestration_delivery?replicaSet=rs0"
      KEYCLOAK_CLIENT_ID: "orchestration-delivery-management"
      CONFIG_SERVICE_CATALOG_MANAGEMENT_URL: "http://product-specification:8080/serviceCatalogManagement/v1/serviceSpecification"
      CONFIG_SERVICE_ORDERING_URL: "http://activation-service:8080/serviceOrdering/v1/serviceOrder"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  orchestration-delivery-fallout:
    image: ${DELIVERY_FALLOUT_IMAGE:-otb-poc/orchestration-delivery-fallout}
    profiles: ["core"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      auth-userrole:
        condition: service_healthy
    ports:
      - "${DELIVERY_FALLOUT_PORT:-18084}:8080"
      - "${DELIVERY_FALLOUT_MANAGEMENT_PORT:-19084}:9000"
    environment:
      <<: *discobole-service-env
      SPRING_PROFILES_ACTIVE: "dev,plaintextconsole,no-security"
      PORT: "8080"
      SPRING_APPLICATION_NAME: "orchestration-delivery-fallout"
      SPRING_DATA_MONGODB_DATABASE: "falloutmanagement"
      SPRING_DATA_MONGODB_URI: "mongodb://mongodb:27017/falloutmanagement?replicaSet=rs0"
      KEYCLOAK_CLIENT_ID: "orchestration-delivery-fallout"
      APP_SECURITY_USER_ROLE_RETRIEVAL_URL: "http://auth-userrole:8080/userRolePermission/v1/userRole"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/1/cmdline | tr '\\0' ' ' | grep -q java"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

volumes:
  mongodb-data:

networks:
  default:
    name: otb-poc-infra
